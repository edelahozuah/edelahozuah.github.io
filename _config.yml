markdown: kramdown
permalink: pretty

# Los metadatos (título, descripción, idiomas, JSON-LD) los pone
# _includes/metadatos.html; no se usa jekyll-seo-tag.
plugins:
  - jekyll-sitemap

# Vídeos de YouTube: una página por vídeo e idioma en _videos/<asignatura>/,
# generada con scripts/importar_video.py. El vídeo sigue en YouTube.
collections:
  videos:
    output: true

defaults:
  - scope: { path: "" }
    values: { layout: pagina }
  - scope: { path: "", type: videos }
    values: { layout: video }

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
