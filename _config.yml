title: Enrique de la Hoz
description: Profesor Titular de Universidad en la Universidad de Alcalá. Docencia e investigación en redes de comunicaciones y ciberseguridad.
url: https://edelahozuah.github.io
baseurl: ""
lang: es
timezone: Europe/Madrid

autor:
  nombre: Enrique de la Hoz
  puesto: Profesor Titular de Universidad
  departamento: Departamento de Automática
