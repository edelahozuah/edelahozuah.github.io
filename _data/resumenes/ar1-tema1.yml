# Resúmenes de las visualizaciones de AR1, tema 1. Los usa scripts/estilo_visualizaciones.py (texto estático y JSON-LD de cada visualización) y llms-full.txt.

/docencia/ar1/retardos/codificacion-tiempo-de-bit.html:
  resumen: >-
    Muestra la forma de onda de una secuencia de entre 2 y 24 bits (escrita a mano o aleatoria) codificada en NRZ-L, NRZ-I o Manchester, junto con el tiempo de bit T_b = 1/R. El estudiante cambia la tasa R del enlace, de 1 Mbps a 1 Gbps en escala logarítmica, y reproduce la transmisión con un cursor que resalta el bit que se está enviando. Las tarjetas dan T_b, el número de bits L y el retardo de transmisión L/R. La idea clave es que cada bit ocupa el enlace un tiempo fijo y que el retardo de transmisión es la suma de esos intervalos.
  conceptos: [tiempo de bit, tasa de transmisión, retardo de transmisión, codificación de línea, NRZ-L, NRZ-I, Manchester, forma de onda]
  formulas:
    - "T_b = 1/R"
    - "retardo de transmisión = L · T_b = L / R"

/docencia/ar1/retardos/retardos-espacio-tiempo.html:
  resumen: >-
    Diagrama espacio-tiempo con el emisor a la izquierda, el receptor a la derecha y el tiempo hacia abajo, en el que se dibujan paquetes de datos y ACK. El estudiante ajusta el tamaño del paquete L, la tasa R, la distancia d, la velocidad de propagación s (2·10⁸ o 3·10⁸ m/s), el número de paquetes, el tamaño del ACK y el modo de intercambio: sin ACK, parada y espera o pipelining. Las tarjetas muestran los retardos de transmisión y de propagación, el tiempo total y la utilización del emisor. Permite ver cuándo domina cada retardo y por qué parada y espera aprovecha poco el enlace.
  conceptos: [retardo de transmisión, retardo de propagación, RTT, parada y espera, pipelining, utilización del emisor, ACK, diagrama espacio-tiempo]
  formulas:
    - "d_trans = L / R"
    - "d_prop = d / s"
    - "utilización = N · L/R / tiempo total"

/docencia/ar1/retardos/diagrama-retardos.html:
  resumen: >-
    Editor de diagramas de tiempos entre dos extremos, con el tiempo hacia abajo y los retardos dibujados a escala. El estudiante fija la velocidad R del enlace y el retardo de propagación, directamente o como distancia entre velocidad, y añade tramas y ACK desde cualquiera de los dos extremos con su tamaño L. Cada mensaje puede empezar tras la última recepción, justo tras la transmisión anterior, al recibir o terminar de transmitirse otro mensaje, a la vez que otro o en un instante dado, con una espera opcional para modelar el tiempo de proceso. Las cotas del mensaje seleccionado y una tabla dan inicio, d_trans, llegada del primer y del último bit de cada mensaje; hay ejemplos de parada y espera, ráfaga de tramas y tráfico bidireccional, y el diagrama se exporta en SVG o PNG.
  conceptos: [retardo de transmisión, retardo de propagación, diagrama de tiempos, trama, ACK, parada y espera, tiempo de proceso, tráfico bidireccional]
  formulas:
    - "d_trans = L / R"
    - "d_prop = d / v"
    - "llegada del último bit = inicio + d_trans + d_prop"

/docencia/ar1/capas/capas_logica_vs_real.html:
  resumen: >-
    Explica en tres vistas que la comunicación entre capas homólogas es lógica y que solo se transmiten señales por el medio físico. La primera anima una PDU entre un host Wi-Fi, un router y un host Ethernet: el estudiante elige el punto de vista de cada capa, abre la caja negra del servicio inferior y puede segmentar un mensaje de 4000 octetos en tres segmentos TCP. La segunda distingue servicio, protocolo e interfaz (SAP) paso a paso y permite cambiar el protocolo de la capa. La tercera indica qué entidad escribe y cuál lee cada cabecera de la trama.
  conceptos: [comunicación lógica, encapsulado, PDU, SDU, PCI, servicio, protocolo, interfaz, SAP, segmentación]

/docencia/ar1/colas/conmutacion_paquetes_colas.html:
  resumen: >-
    Simulación de un router con cuatro orígenes, un buffer finito y un enlace de salida. El estudiante varía la intensidad de tráfico ρ = λ·L/R (de 0,05 a 1,6), el tamaño del buffer (1 a 16 paquetes), el patrón de llegadas (Poisson, regulares o en ráfagas) y el tamaño de los paquetes (fijo o exponencial). Se miden la ocupación de la cola, el retardo en cola, la utilización del enlace, los descartes y el caudal, y se comparan con la curva teórica M/M/1/N, que es exacta cuando los tamaños son exponenciales. Muestra que la cola crece con ρ y que hay descartes incluso con ρ < 1, y que con ρ > 1 se descarta de forma estructural.
  conceptos: [intensidad de tráfico, retardo de cola, buffer finito, descarte de paquetes, utilización del enlace, conmutación de paquetes, cola M/M/1/N, ráfagas]
  formulas:
    - "ρ = λ · L / R"
    - "tiempo de servicio = L / R"
    - "fracción descartada ≈ (ρ − 1) / ρ para ρ > 1"

/docencia/ar1/retardos/codificacion-tiempo-de-bit-en.html:
  resumen: >-
    Shows the waveform of a 2 to 24 bit sequence (typed in or random) encoded as NRZ-L, NRZ-I or Manchester, together with the bit time T_b = 1/R. The student changes the link rate R, from 1 Mbps to 1 Gbps on a logarithmic scale, and plays back the transmission with a cursor that highlights the bit currently being sent. The cards give T_b, the number of bits L and the transmission delay L/R. The key idea is that every bit occupies the link for a fixed time, and the transmission delay is the sum of those intervals.
  conceptos: [bit time, transmission rate, transmission delay, line coding, NRZ-L, NRZ-I, Manchester, waveform]
  formulas:
    - "T_b = 1/R"
    - "transmission delay = L · T_b = L / R"

/docencia/ar1/retardos/retardos-espacio-tiempo-en.html:
  resumen: >-
    Space-time diagram with the sender on the left, the receiver on the right and time running downwards, in which data packets and ACKs are drawn. The student sets the packet size L, the rate R, the distance d, the propagation speed s (2·10⁸ or 3·10⁸ m/s), the number of packets, the ACK size and the exchange mode: no ACK, stop-and-wait or pipelining. The cards show the transmission and propagation delays, the total time and the sender utilization. It shows when each delay dominates and why stop-and-wait makes poor use of the link.
  conceptos: [transmission delay, propagation delay, RTT, stop-and-wait, pipelining, sender utilization, ACK, space-time diagram]
  formulas:
    - "d_trans = L / R"
    - "d_prop = d / s"
    - "utilization = N · L/R / total time"

/docencia/ar1/retardos/diagrama-retardos-en.html:
  resumen: >-
    Editor for timing diagrams between two ends, with time running downwards and delays drawn to scale. The student sets the link rate R and the propagation delay, either directly or as distance over speed, and adds frames and ACKs from either end with their size L. Each message can start after the last reception, right after the previous transmission, when another message is received or finishes transmitting, together with another one or at a given time, with an optional wait to model processing time. Dimension lines on the selected message and a table give the start, d_trans and the arrival of the first and last bit of every message; there are examples of stop-and-wait, a burst of frames and bidirectional traffic, and the diagram can be exported as SVG or PNG.
  conceptos: [transmission delay, propagation delay, timing diagram, frame, ACK, stop-and-wait, processing time, bidirectional traffic]
  formulas:
    - "d_trans = L / R"
    - "d_prop = d / v"
    - "last bit arrives = start + d_trans + d_prop"

/docencia/ar1/capas/layers_logical_vs_real.html:
  resumen: >-
    Explains in three views that communication between peer layers is only logical and that the only thing actually transmitted is signals over the physical medium. The first animates a PDU between a Wi-Fi host, a router and an Ethernet host: the student picks each layer's point of view, opens the black box of the underlying service and can segment a 4000-byte message into three TCP segments. The second tells service, protocol and interface (SAP) apart step by step and lets the student swap the layer's protocol. The third shows which entity writes and which reads each header of the frame.
  conceptos: [logical communication, encapsulation, PDU, SDU, PCI, service, protocol, interface, SAP, segmentation]

/docencia/ar1/colas/queueing_drops_router.html:
  resumen: >-
    Simulation of a router with four sources, a finite buffer and one output link. The student varies the traffic intensity ρ = λ·L/R (0.05 to 1.6), the buffer size (1 to 16 packets), the arrival pattern (Poisson, regular or bursty) and the packet size (fixed or exponential). Queue occupancy, queueing delay, link utilization, drops and throughput are measured and compared with the theoretical M/M/1/N curve, which is exact when packet sizes are exponential. It shows that queues grow with ρ, that packets are dropped even when ρ < 1, and that with ρ > 1 dropping becomes structural.
  conceptos: [traffic intensity, queueing delay, finite buffer, packet drop, link utilization, packet switching, M/M/1/N queue, bursty traffic]
  formulas:
    - "ρ = λ · L / R"
    - "service time = L / R"
    - "dropped fraction ≈ (ρ − 1) / ρ for ρ > 1"
