# Generado por scripts/importar_visualizaciones.py a partir de catalog.yml del
# repositorio computer-networks-visualizations. No editar a mano: los textos se
# corrigen en el catálogo del repositorio. Lo usan scripts/estilo_visualizaciones.py
# (texto estático y JSON-LD de cada visualización) y llms-full.txt.

/docencia/ar1/retardos/codificacion-tiempo-de-bit.html:
  resumen: >-
    Muestra la forma de onda de una secuencia de entre 2 y 24 bits (escrita a mano o aleatoria) codificada
    en NRZ-L, NRZ-I o Manchester, junto con el tiempo de bit T_b = 1/R. El estudiante cambia la tasa R
    del enlace, de 1 Mbps a 1 Gbps en escala logarítmica, y reproduce la transmisión con un cursor que
    resalta el bit que se está enviando. Las tarjetas dan T_b, el número de bits L y el retardo de transmisión
    L/R. La idea clave es que cada bit ocupa el enlace un tiempo fijo y que el retardo de transmisión
    es la suma de esos intervalos.
  conceptos:
  - tiempo de bit
  - tasa de transmisión
  - retardo de transmisión
  - codificación de línea
  - NRZ-L
  - NRZ-I
  - Manchester
  - forma de onda
  formulas:
  - T_b = 1/R
  - retardo de transmisión = L · T_b = L / R
/docencia/ar1/retardos/codificacion-tiempo-de-bit-en.html:
  resumen: >-
    Shows the waveform of a 2 to 24 bit sequence (typed in or random) encoded as NRZ-L, NRZ-I or Manchester,
    together with the bit time T_b = 1/R. The student changes the link rate R, from 1 Mbps to 1 Gbps on
    a logarithmic scale, and plays back the transmission with a cursor that highlights the bit currently
    being sent. The cards give T_b, the number of bits L and the transmission delay L/R. The key idea
    is that every bit occupies the link for a fixed time, and the transmission delay is the sum of those
    intervals.
  conceptos:
  - bit time
  - transmission rate
  - transmission delay
  - line coding
  - NRZ-L
  - NRZ-I
  - Manchester
  - waveform
  formulas:
  - T_b = 1/R
  - transmission delay = L · T_b = L / R
/docencia/ar1/retardos/retardos-espacio-tiempo.html:
  resumen: >-
    Diagrama espacio-tiempo con el emisor a la izquierda, el receptor a la derecha y el tiempo hacia abajo,
    en el que se dibujan paquetes de datos y ACK. El estudiante ajusta el tamaño del paquete L, la tasa
    R, la distancia d, la velocidad de propagación s (2·10⁸ o 3·10⁸ m/s), el número de paquetes, el tamaño
    del ACK y el modo de intercambio: sin ACK, parada y espera o pipelining. Las tarjetas muestran los
    retardos de transmisión y de propagación, el tiempo total y la utilización del emisor. Permite ver
    cuándo domina cada retardo y por qué parada y espera aprovecha poco el enlace.
  conceptos:
  - retardo de transmisión
  - retardo de propagación
  - RTT
  - parada y espera
  - pipelining
  - utilización del emisor
  - ACK
  - diagrama espacio-tiempo
  formulas:
  - d_trans = L / R
  - d_prop = d / s
  - utilización = N · L/R / tiempo total
/docencia/ar1/retardos/retardos-espacio-tiempo-en.html:
  resumen: >-
    Space-time diagram with the sender on the left, the receiver on the right and time running downwards,
    in which data packets and ACKs are drawn. The student sets the packet size L, the rate R, the distance
    d, the propagation speed s (2·10⁸ or 3·10⁸ m/s), the number of packets, the ACK size and the exchange
    mode: no ACK, stop-and-wait or pipelining. The cards show the transmission and propagation delays,
    the total time and the sender utilization. It shows when each delay dominates and why stop-and-wait
    makes poor use of the link.
  conceptos:
  - transmission delay
  - propagation delay
  - RTT
  - stop-and-wait
  - pipelining
  - sender utilization
  - ACK
  - space-time diagram
  formulas:
  - d_trans = L / R
  - d_prop = d / s
  - utilization = N · L/R / total time
/docencia/ar1/capas/capas_logica_vs_real.html:
  resumen: >-
    Explica en tres vistas que la comunicación entre capas homólogas es lógica y que solo se transmiten
    señales por el medio físico. La primera anima una PDU entre un host Wi-Fi, un router y un host Ethernet:
    el estudiante elige el punto de vista de cada capa, abre la caja negra del servicio inferior y puede
    segmentar un mensaje de 4000 octetos en tres segmentos TCP. La segunda distingue servicio, protocolo
    e interfaz (SAP) paso a paso y permite cambiar el protocolo de la capa. La tercera indica qué entidad
    escribe y cuál lee cada cabecera de la trama.
  conceptos:
  - comunicación lógica
  - encapsulado
  - PDU
  - SDU
  - PCI
  - servicio
  - protocolo
  - interfaz
  - SAP
  - segmentación
/docencia/ar1/capas/layers_logical_vs_real.html:
  resumen: >-
    Explains in three views that communication between peer layers is only logical and that the only thing
    actually transmitted is signals over the physical medium. The first animates a PDU between a Wi-Fi
    host, a router and an Ethernet host: the student picks each layer's point of view, opens the black
    box of the underlying service and can segment a 4000-byte message into three TCP segments. The second
    tells service, protocol and interface (SAP) apart step by step and lets the student swap the layer's
    protocol. The third shows which entity writes and which reads each header of the frame.
  conceptos:
  - logical communication
  - encapsulation
  - PDU
  - SDU
  - PCI
  - service
  - protocol
  - interface
  - SAP
  - segmentation
/docencia/ar1/colas/conmutacion_paquetes_colas.html:
  resumen: >-
    Simulación de un router con cuatro orígenes, un buffer finito y un enlace de salida. El estudiante
    varía la intensidad de tráfico ρ = λ·L/R (de 0,05 a 1,6), el tamaño del buffer (1 a 16 paquetes),
    el patrón de llegadas (Poisson, regulares o en ráfagas) y el tamaño de los paquetes (fijo o exponencial).
    Se miden la ocupación de la cola, el retardo en cola, la utilización del enlace, los descartes y el
    caudal, y se comparan con la curva teórica M/M/1/N, que es exacta cuando los tamaños son exponenciales.
    Muestra que la cola crece con ρ y que hay descartes incluso con ρ < 1, y que con ρ > 1 se descarta
    de forma estructural.
  conceptos:
  - intensidad de tráfico
  - retardo de cola
  - buffer finito
  - descarte de paquetes
  - utilización del enlace
  - conmutación de paquetes
  - cola M/M/1/N
  - ráfagas
  formulas:
  - ρ = λ · L / R
  - tiempo de servicio = L / R
  - fracción descartada ≈ (ρ − 1) / ρ para ρ > 1
/docencia/ar1/colas/queueing_drops_router.html:
  resumen: >-
    Simulation of a router with four sources, a finite buffer and one output link. The student varies
    the traffic intensity ρ = λ·L/R (0.05 to 1.6), the buffer size (1 to 16 packets), the arrival pattern
    (Poisson, regular or bursty) and the packet size (fixed or exponential). Queue occupancy, queueing
    delay, link utilization, drops and throughput are measured and compared with the theoretical M/M/1/N
    curve, which is exact when packet sizes are exponential. It shows that queues grow with ρ, that packets
    are dropped even when ρ < 1, and that with ρ > 1 dropping becomes structural.
  conceptos:
  - traffic intensity
  - queueing delay
  - finite buffer
  - packet drop
  - link utilization
  - packet switching
  - M/M/1/N queue
  - bursty traffic
  formulas:
  - ρ = λ · L / R
  - service time = L / R
  - dropped fraction ≈ (ρ − 1) / ρ for ρ > 1
/docencia/ar1/retardos/diagrama-retardos.html:
  resumen: >-
    Editor de diagramas de tiempos entre dos extremos, con el tiempo hacia abajo y los retardos dibujados
    a escala. El estudiante fija la velocidad R del enlace y el retardo de propagación, directamente o
    como distancia entre velocidad, y añade tramas y ACK desde cualquiera de los dos extremos con su tamaño
    L. Cada mensaje puede empezar tras la última recepción, justo tras la transmisión anterior, al recibir
    o terminar de transmitirse otro mensaje, a la vez que otro o en un instante dado, con una espera opcional
    para modelar el tiempo de proceso. Las cotas del mensaje seleccionado y una tabla dan inicio, d_trans,
    llegada del primer y del último bit de cada mensaje; hay ejemplos de parada y espera, ráfaga de tramas
    y tráfico bidireccional, y el diagrama se exporta en SVG o PNG.
  conceptos:
  - retardo de transmisión
  - retardo de propagación
  - diagrama de tiempos
  - trama
  - ACK
  - parada y espera
  - tiempo de proceso
  - tráfico bidireccional
  formulas:
  - d_trans = L / R
  - d_prop = d / v
  - llegada del último bit = inicio + d_trans + d_prop
/docencia/ar1/retardos/diagrama-retardos-en.html:
  resumen: >-
    Editor for timing diagrams between two ends, with time running downwards and delays drawn to scale.
    The student sets the link rate R and the propagation delay, either directly or as distance over speed,
    and adds frames and ACKs from either end with their size L. Each message can start after the last
    reception, right after the previous transmission, when another message is received or finishes transmitting,
    together with another one or at a given time, with an optional wait to model processing time. Dimension
    lines on the selected message and a table give the start, d_trans and the arrival of the first and
    last bit of every message; there are examples of stop-and-wait, a burst of frames and bidirectional
    traffic, and the diagram can be exported as SVG or PNG.
  conceptos:
  - transmission delay
  - propagation delay
  - timing diagram
  - frame
  - ACK
  - stop-and-wait
  - processing time
  - bidirectional traffic
  formulas:
  - d_trans = L / R
  - d_prop = d / v
  - last bit arrives = start + d_trans + d_prop
/docencia/ar1/lab-retardos/01-anatomia-del-retardo.html:
  resumen: >-
    Animación a escala de un paquete que se transmite por un enlace de A a B, basada en el problema P6
    de Kurose. Muestra dónde están el primer y el último bit en cada instante, junto con un diagrama espacio-tiempo.
    El estudiante ajusta el tamaño del paquete, la tasa de transmisión, la longitud del enlace y la velocidad
    de propagación (o elige un caso predefinido), salta a los instantes clave, usa la lupa y el modo predicción.
    Una calculadora resuelve cualquier enunciado. La idea central es que el retardo de transmisión depende
    de L/R y el de propagación de l/v_p, y que su comparación indica si el paquete cabe entero en el enlace.
  conceptos:
  - retardo de transmisión
  - retardo de propagación
  - retardo extremo a extremo
  - tasa de transmisión
  - velocidad de propagación
  - longitud del paquete en el medio
  - diagrama espacio-tiempo
  - punto de equilibrio
  formulas:
  - d_trans = L / R
  - d_prop = l / v_p
  - extremo a extremo = d_trans + d_prop
  - longitud del paquete = v_p·L / R
  - 'equilibrio (d_prop = d_trans): l = v_p·L / R'
/docencia/ar1/lab-retardos/01-anatomy-of-delay.html:
  resumen: >-
    A to-scale animation of a packet sent over a link from A to B, based on problem P6 from Kurose. It
    shows where the first and the last bit are at every instant, next to a space-time diagram. The student
    adjusts packet size, transmission rate, link length and propagation speed (or picks a preset), jumps
    to key moments, zooms in on the head of the packet and switches on prediction mode. A calculator solves
    any problem statement. The main idea is that transmission delay depends on L/R and propagation delay
    on l/v_p, and comparing them tells whether the whole packet fits on the link at once.
  conceptos:
  - transmission delay
  - propagation delay
  - end-to-end delay
  - transmission rate
  - propagation speed
  - packet length on the medium
  - space-time diagram
  - break-even point
  formulas:
  - d_trans = L / R
  - d_prop = l / v_p
  - end-to-end = d_trans + d_prop
  - packet length = v_p·L / R
  - 'break-even (d_prop = d_trans): l = v_p·L / R'
/docencia/ar1/lab-retardos/02-tuberia-ancho-de-bit.html:
  resumen: >-
    Visualización del enlace como una tubería por la que se vierte un fichero, para los problemas P25,
    P26 y P27 de Kurose. Muestra cuántos bits hay en el enlace en cada instante, la capacidad de la tubería
    (producto ancho de banda-retardo), el máximo de bits en vuelo y el ancho físico de un bit en metros,
    comparado con un campo de fútbol. El estudiante modifica la tasa, el tamaño del fichero, la longitud
    y la velocidad de propagación, mueve una lupa sobre la tubería y compara 2 Mbps con 1 Gbps. Se aprecia
    que a tasas altas caben muchos bits y cada uno ocupa muy poco espacio.
  conceptos:
  - producto ancho de banda-retardo
  - bits en vuelo
  - capacidad del enlace
  - ancho de un bit
  - retardo de transmisión
  - retardo de propagación
  - tasa de transmisión
  formulas:
  - d_prop = m / s
  - d_trans = F / R
  - capacidad de la tubería = R·d_prop
  - máximo de bits en el enlace = min(F, R·d_prop)
  - ancho de un bit = s / R
  - longitud del fichero en el medio = s·F / R
  - R con la que un bit llena el enlace = s / m
/docencia/ar1/lab-retardos/02-pipe-bit-width.html:
  resumen: >-
    A view of the link as a pipe into which a file is poured, for problems P25, P26 and P27 from Kurose.
    It shows how many bits are on the link at each instant, the capacity of the pipe (the bandwidth-delay
    product), the maximum number of bits in flight and the physical width of a bit in metres, compared
    with a football pitch. The student changes the rate, file size, link length and propagation speed,
    moves a magnifier along the pipe and compares 2 Mbps with 1 Gbps. It shows that at high rates many
    bits fit on the link and each one takes up very little space.
  conceptos:
  - bandwidth-delay product
  - bits in flight
  - link capacity
  - width of a bit
  - transmission delay
  - propagation delay
  - transmission rate
  formulas:
  - d_prop = m / s
  - d_trans = F / R
  - pipe capacity = R·d_prop
  - maximum bits on the link = min(F, R·d_prop)
  - width of a bit = s / R
  - file length on the medium = s·F / R
  - R at which one bit fills the link = s / m
/docencia/ar1/lab-retardos/03-continuo-vs-parada-y-espera.html:
  resumen: >-
    Compara dos formas de enviar el mismo fichero entre A y B, según el problema P28 de Kurose (20 000
    km, 2 Mbps, 800 000 bits): como un único mensaje continuo y dividido en N paquetes con parada y espera,
    donde cada paquete espera su reconocimiento (ACK) antes de enviar el siguiente. Muestra ambos escenarios
    animados, sus diagramas espacio-tiempo, la utilización del enlace y el tiempo total. El estudiante
    cambia el tamaño del fichero, la tasa, la distancia y N, y puede probar una ventana de varios paquetes
    sin reconocer. El resultado muestra que el RTT domina el tiempo y deja el enlace casi ocioso.
  conceptos:
  - parada y espera
  - envío continuo
  - tiempo de ida y vuelta (RTT)
  - reconocimiento (ACK)
  - utilización del enlace
  - retardo de transmisión
  - retardo de propagación
  - ventana
  formulas:
  - d_trans = F / R
  - d_prop = distancia / v_p
  - RTT = 2·d_prop
  - tiempo continuo = F/R + d_prop
  - tiempo con parada y espera (ventana 1, ACK despreciable) = N·(F/(N·R) + RTT)
  - utilización = d_trans total / tiempo total
/docencia/ar1/lab-retardos/03-continuous-vs-stop-and-wait.html:
  resumen: >-
    Compares two ways of sending the same file between A and B, following problem P28 from Kurose (20,000
    km, 2 Mbps, 800,000 bits): as a single continuous message, and split into N packets with stop-and-wait,
    where each packet waits for its acknowledgement (ACK) before the next one is sent. It shows both scenarios
    animated, their space-time diagrams, link utilization and total time. The student changes file size,
    rate, distance and N, and can also try a window of several unacknowledged packets. The outcome shows
    that the RTT dominates the time and leaves the link mostly idle.
  conceptos:
  - stop-and-wait
  - continuous transmission
  - round-trip time (RTT)
  - acknowledgement (ACK)
  - link utilization
  - transmission delay
  - propagation delay
  - window
  formulas:
  - d_trans = F / R
  - d_prop = distance / v_p
  - RTT = 2·d_prop
  - continuous time = F/R + d_prop
  - stop-and-wait time (window 1, negligible ACK) = N·(F/(N·R) + RTT)
  - utilization = total d_trans / total time
/docencia/ar1/dns/dns_nombres.html:
  resumen: >-
    Descompone un nombre de dominio en sus etiquetas y lo sitúa en el árbol del DNS. El estudiante escribe
    un nombre o elige un ejemplo, y recorre los niveles desde la raíz hacia abajo o desde el nombre hacia
    arriba, con una pausa opcional para predecir. Cada sufijo se muestra como un dominio, con su padre
    y una explicación del TLD y del dominio de segundo nivel. Un panel comprueba las reglas: 63 caracteres
    por etiqueta, 253 en total, letras, cifras y guiones, punto final, mayúsculas y punycode. Enseña que
    un nombre se escribe de lo particular a lo general y el árbol se recorre desde la raíz.
  conceptos:
  - etiqueta
  - dominio
  - árbol de nombres
  - raíz
  - dominio de nivel superior (TLD)
  - nombre completo (FQDN)
  - punycode
  - host
/docencia/ar1/dns/dns_names_en.html:
  resumen: >-
    Breaks a domain name into its labels and places it in the DNS tree. The student types a name or picks
    an example, and walks the levels from the root downwards or from the name upwards, with an optional
    pause to predict. Each suffix is shown as a domain, with its parent and an explanation of the TLD
    and of the second-level domain. A panel checks the rules: 63 characters per label, 253 in total, letters,
    digits and hyphens, trailing dot, case and punycode. It teaches that a name is written from the specific
    to the general and the tree is walked from the root.
  conceptos:
  - label
  - domain
  - name tree
  - root
  - top-level domain (TLD)
  - fully qualified domain name (FQDN)
  - punycode
  - host
/docencia/ar1/dns/dns_delegacion.html:
  resumen: >-
    Muestra cómo se reparte el espacio de nombres DNS en zonas mediante delegación, con la cadena IANA,
    Red.es, UAH y departamentos. En «Paso a paso» se ve el árbol coloreado por zonas y los ficheros de
    zona (SOA, NS, A) cambiando en cada delegación, con una pausa opcional para predecir. En «Delega tú»
    el estudiante actúa como cada responsable, crea dominios y hosts, cede ramas indicando servidor y
    dirección, y ve cuándo el registro de pegamento (glue) es obligatorio. Al pulsar un nombre se muestra
    la cadena de referencias hasta su servidor autoritativo. Distingue dominio y zona.
  conceptos:
  - delegación de zona
  - zona
  - registro NS
  - registro de pegamento (glue)
  - servidor autoritativo
  - fichero de zona
  - referencia
  - dominio frente a zona
/docencia/ar1/dns/dns_delegation_en.html:
  resumen: >-
    Shows how the DNS name space is split into zones through delegation, using the chain IANA, Red.es,
    UAH and departments. In "Step by step" the tree is coloured by zone and the zone files (SOA, NS, A)
    change with each delegation, with an optional pause to predict. In "Your turn" the student acts as
    each zone owner, creates domains and hosts, hands over branches by giving a server name and address,
    and sees when the glue record is mandatory. Clicking a name shows the chain of referrals leading to
    its authoritative server. It distinguishes a domain from a zone.
  conceptos:
  - zone delegation
  - zone
  - NS record
  - glue record
  - authoritative server
  - zone file
  - referral
  - domain versus zone
/docencia/ar1/dns/dns_consultas.html:
  resumen: >-
    Animación mensaje a mensaje de la resolución de gaia.cs.umass.edu por un host, con todas las cachés
    vacías, en un escenario de host, resolutor local, servidor raíz, servidor TLD .edu y servidor autoritativo.
    Tiene tres modos: iterativa, recursiva y comparar ambas. Cada uno de los 8 mensajes indica su tipo
    (consulta, referencia o respuesta), sus campos (RD, AA, TTL) y lo que se guarda en caché, y marca
    qué servidores mantienen una consulta ajena pendiente. Muestra que en la práctica solo la primera
    consulta es recursiva, y que la raíz y los TLD responden con referencias para no acumular consultas
    pendientes.
  conceptos:
  - consulta iterativa
  - consulta recursiva
  - resolutor local
  - referencia
  - servidor autoritativo
  - caché
  - TTL
  - servidor raíz
/docencia/ar1/dns/dns_queries_en.html:
  resumen: >-
    Message-by-message animation of how a host resolves gaia.cs.umass.edu with every cache empty, in a
    scenario made of a host, a local DNS server, a root server, a .edu TLD server and an authoritative
    server. It has three modes: iterative, recursive and a side-by-side comparison. Each of the 8 messages
    states its type (query, referral or answer), its fields (RD, AA, TTL) and what gets cached, and marks
    which servers hold someone else's query pending. It shows that in practice only the first query is
    recursive, and that root and TLD servers reply with referrals so that they do not accumulate pending
    queries.
  conceptos:
  - iterative query
  - recursive query
  - local DNS server
  - referral
  - authoritative server
  - cache
  - TTL
  - root server
/docencia/ar1/dns/dns_consultas_mixtas.html:
  resumen: >-
    Amplía las figuras 2.19 y 2.20 de Kurose y Ross: la resolución de gaia.cs.umass.edu con las cachés
    vacías, pero el estudiante decide si cada servidor (local, raíz, TLD .edu y autoritativo) atiende
    las consultas que recibe de forma recursiva o iterativa, en el panel o pulsando la etiqueta de cada
    servidor en el dibujo. La animación genera los 8 mensajes de esa configuración, con su tipo (consulta,
    referencia o respuesta), los campos RD, RA y AA y lo que se guarda en caché, y marca qué servidores
    tienen que recordar una consulta ajena. Al final, una tabla compara cuántos mensajes y consultas ha
    enviado cada equipo y quién ha esperado. Muestra que el número de mensajes no cambia, sino quién hace
    el trabajo, y por qué en la práctica solo el servidor local es recursivo.
  conceptos:
  - consulta iterativa
  - consulta recursiva
  - resolutor local
  - referencia
  - servidor raíz
  - servidor TLD
  - servidor autoritativo
  - caché
  - bit RD
  - bit RA
  - bit AA
  - consulta pendiente
/docencia/ar1/dns/dns_queries_mixed_en.html:
  resumen: >-
    An extension of Figs. 2.19 and 2.20 in Kurose and Ross: resolving gaia.cs.umass.edu with every cache
    empty, but the student decides whether each server (local, root, .edu TLD and authoritative) handles
    the queries it receives recursively or iteratively, in the panel or by clicking the label next to
    each server in the diagram. The animation builds the 8 messages for that configuration, with their
    type (query, referral or answer), the RD, RA and AA fields and what gets cached, and marks which servers
    have to remember someone else's query. At the end, a table compares how many messages and queries
    each device sent and who had to wait. It shows that the number of messages does not change, only who
    does the work, and why in practice only the local server is recursive.
  conceptos:
  - iterative query
  - recursive query
  - local DNS server
  - referral
  - root server
  - TLD server
  - authoritative server
  - cache
  - RD bit
  - RA bit
  - AA bit
  - pending query
/docencia/ar1/dns/dns_paso_a_paso.html:
  resumen: >-
    Animación por pasos que cuenta el DNS desde el porqué en seis actos y 27 pasos. La dirección IP dice
    dónde está un equipo y depende de su proveedor, así que al mudarse se rompe todo lo que la tenía apuntada;
    un nombre añade un nivel de indirección que administra su dueño. La tabla de nombres empieza como
    un fichero central (HOSTS.TXT) que no escala y pasa a ser una base de datos distribuida, jerárquica
    y delegada en zonas, cuyo árbol no coincide con el de direcciones. El equipo final solo hace una pregunta
    al resolutor local y espera; detrás, el resolutor local recorre raíz, TLD .es y servidor autoritativo
    para resolver www.rediris.es, con referencias, pegamento (glue), los bits RD, RA y AA y la caché,
    en un mapa y un diagrama de secuencia que se construyen a la vez. Después muestra que recursiva e
    iterativa se dice de cada pareja consulta-respuesta, qué pasaría si todo fuese recursivo o todo iterativo,
    y termina con los ocho mensajes, su destino y sus secciones (Question, Answer, Authority, Additional).
  conceptos:
  - dirección IP
  - nivel de indirección
  - nombre de dominio
  - registro A
  - TTL
  - HOSTS.TXT
  - árbol de nombres
  - zona
  - delegación
  - resolutor del sistema (stub)
  - resolutor local
  - servidor raíz
  - servidor TLD
  - servidor autoritativo
  - referencia
  - registro de pegamento (glue)
  - caché
  - consulta recursiva
  - consulta iterativa
  - bit RD
  - bit RA
  - bit AA
  - diagrama de secuencia
/docencia/ar1/dns/dns_step_by_step_en.html:
  resumen: >-
    A step-by-step animation that tells the story of the DNS from the why in six acts and 27 steps. An
    IP address says where a host is and depends on its provider, so moving breaks everything that had
    it written down; a name adds a level of indirection managed by its owner. The name table starts as
    a central file (HOSTS.TXT) that does not scale and becomes a distributed, hierarchical database delegated
    in zones, whose tree does not match the address tree. The end host only asks the local resolver one
    question and waits; behind it, the local resolver walks the root, the .es TLD and the authoritative
    server to resolve www.rediris.es, with referrals, glue, the RD, RA and AA bits and the cache, on a
    map and a sequence diagram built side by side. It then shows that recursive and iterative describe
    each query-response pair, what would happen if everything were recursive or everything iterative,
    and ends with the eight messages, their destination and their sections (Question, Answer, Authority,
    Additional).
  conceptos:
  - IP address
  - level of indirection
  - domain name
  - A record
  - TTL
  - HOSTS.TXT
  - name tree
  - zone
  - delegation
  - stub resolver
  - local resolver
  - root server
  - TLD server
  - authoritative server
  - referral
  - glue record
  - cache
  - recursive query
  - iterative query
  - RD bit
  - RA bit
  - AA bit
  - sequence diagram
/docencia/ar1/http/http-persistente.html:
  resumen: >-
    Diagramas de retardos de la descarga de una página web con N objetos alojados en el mismo servidor
    que el HTML base, por una única conexión TCP persistente, con HTTP/1.1 sin canalización y con canalización.
    El navegador descarga primero el HTML y después pide los objetos: sin canalización, cada GET sale
    al recibir el objeto anterior; con canalización, todos los GET salen a la vez y el servidor envía
    las respuestas una tras otra. El estudiante ajusta la velocidad del enlace, el retardo de propagación,
    el tamaño del HTML y el de los objetos (iguales o distintos), el establecimiento TCP y el tiempo de
    procesado del servidor, y ve los dos diagramas a la misma escala, con las cotas de RTT y de tiempo
    de transmisión, los huecos en que el enlace está ocioso, la fórmula con los valores sustituidos y
    una tabla de instantes. Puede reproducir la descarga paso a paso, practicar con ejercicios aleatorios
    y exportar el diagrama en SVG o PNG. Muestra que la canalización ahorra (N−1)·(RTT + t_proc).
  conceptos:
  - HTTP persistente
  - canalización (pipelining)
  - conexión TCP
  - establecimiento de la conexión
  - tiempo de ida y vuelta (RTT)
  - retardo de transmisión
  - retardo de propagación
  - objeto referenciado
  - HTML base
  - diagrama de retardos
  - utilización del enlace
  formulas:
  - RTT = 2·d_prop
  - X = L / R
  - 'sin canalización: T = [RTT]_TCP + (RTT + t_proc + X_html) + N·(RTT + t_proc + X)'
  - 'con canalización: T = [RTT]_TCP + (RTT + t_proc + X_html) + RTT + t_proc + N·X'
  - ahorro = (N−1)·(RTT + t_proc)
/docencia/ar1/http/http-persistente-en.html:
  resumen: >-
    Delay diagrams for downloading a web page with N objects stored on the same server as the HTML base
    file, over a single persistent TCP connection, with HTTP/1.1 without pipelining and with pipelining.
    The browser first downloads the HTML and then requests the objects: without pipelining, each GET is
    sent once the previous object has arrived; with pipelining, all the GETs leave at once and the server
    sends the responses back to back. The student adjusts the link rate, the propagation delay, the size
    of the HTML and of the objects (equal or different), the TCP handshake and the server processing time,
    and sees both diagrams on the same time scale, with RTT and transmission-time dimension lines, the
    gaps where the link sits idle, the formula with the values substituted and a table of instants. The
    download can be played step by step, practised with random exercises and exported as SVG or PNG. It
    shows that pipelining saves (N−1)·(RTT + t_proc).
  conceptos:
  - persistent HTTP
  - pipelining
  - TCP connection
  - connection setup
  - round-trip time (RTT)
  - transmission delay
  - propagation delay
  - referenced object
  - HTML base file
  - delay diagram
  - link utilization
  formulas:
  - RTT = 2·d_prop
  - X = L / R
  - 'without pipelining: T = [RTT]_TCP + (RTT + t_proc + X_html) + N·(RTT + t_proc + X)'
  - 'with pipelining: T = [RTT]_TCP + (RTT + t_proc + X_html) + RTT + t_proc + N·X'
  - saving = (N−1)·(RTT + t_proc)
