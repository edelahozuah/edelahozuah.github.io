strategiesforoffergenerationandrelaxationinfuzzyconstraintba:
  idioma: en
  resumen: Fuzzy constraints have been used in several automated multi-attribute negotiation models. It is recognized that fuzzy constraints represent an efficient way of capturing requirements and preferences, and an useful mechanism for representing trade-offs. Most approaches are mainly focused on using co nstraints as a framework for describing preferences, and few works focus on using them as an element in the communication process itself in order to elaborate efficient negotiation strategies. This paper proposes and evaluates a set of strategies for offer generation and for the construction of offer relaxation requests in constraint-based negotiation models. To deploy the strategies, a fuzzy constraint based model for non-mediated bilateral automated purchase negotiations has been used. Fuzzy constraints are used both to represent preferences and to express offers. A set of locutions and decision mechanisms which trigger them are fully specified, where each agent may decide its degree
    of cooperation and its degree of expressiveness. Expressiveness is based on the propagation of constraints and relaxation requests. The paper analyzes which combination of different agents' attitudes allow to improve the negotiation processes. Experimental evaluation confirms the advantage of an expressive approach based on the propagation of constraints. In addition, this paper studies how applying a clustering algorithm to the seller's catalogue of products instead of managing single products may contribute to an improvement in the duration of the negotiation dialogues, and to a significant improvement on the utility of the deals that are achieved. These results support the usefulness of the proposed negotiation strategies.
