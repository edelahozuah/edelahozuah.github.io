onthegoodnessofusingorthogonalchannelsinwlanieee80211inreali:
  idioma: en
  resumen: Due to the high density of Wi‐Fi networks, especially in the unlicensed 2.4 GHz frequency band, channel assignment has become a critical duty for achieving a satisfactory user experience. Probably, the main peculiarity of Wi‐Fi networks is the partial overlap of the radio channels that can be used by access points. For that reason, a number of works avoid cochannel interferences by using only channels which are far enough from each other to have no interferences, the so‐called orthogonal channels. However, there is a range of choices between using the whole spectrum and using only orthogonal channels. In this work we evaluate the influence of the choice of channel set in realistic settings, using both optimization and heuristic approaches. Results show that the optimizer is not able to achieve better results when using the whole spectrum instead of restricting to only the orthogonal channels. In fact, the optimizer uses mainly the orthogonal channels when they are available, while
    the heuristics considered lose performance when more channels are available. We believe this insight will be useful to design new heuristics for Wi‐Fi channel assignment.
protectingsensorsinaniotenvironmentbymodellingcommunications:
  idioma: en
  resumen: The growth of the Internet has generated new types of services based on novel data sources. Among these services, the use of sensors and actuators to create hybrid services that allow humans to interact with the physical environment in a natural way is especially remarkable. These services compose what is called the Internet of Things (IoT). One of the biggest challenges is the protection and access control to the sensors and actuators exposed to the Internet, becoming a critical factor in IoT scenarios. We propose the abstraction of the IoT communication elements as Resources that can be protected using conventional access control schemes. To achieve this, we propose using User-Managed Access (UMA), an existent OAuth2 profile originally developed for the protection of Internet services. To validate our proposal, we have selected MQTT, one of the simplest message-based communication protocols used in IoT environments. We have developed a prototype implementation and a use case
    using a developer board based on the MCU ESP8266 as an IoT device. The performed tests have been focused on validating the proposed solution in terms of the correctness of the access control system, energy consumption and communication delays.
