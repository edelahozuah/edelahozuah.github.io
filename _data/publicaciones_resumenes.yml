anewsdntrafficcontrolapplicationforsecurityroutingincritical:
  idioma: en
  resumen: In the framework of the EU-FP7 SCOUT project, RECOVER is a subsystem that enables a satellite infrastructure, and more specifically the ground control segment, with traffic control capabilities. Basically, RECOVER applies rules (forward, drop, re-route) to traffic flows. In this paper, we discuss the preliminary architecture of the RECOVER subsystem. The design is based on SDN, a novel approach for computer networking that allows network administrators to manage network services through the abstraction of higher-level functionalities. The core of the subsystem is a new traffic control application that provides policy-based secure routing, i.e., the ability to take on routing decisions driven by physical or network security targets.
aninfocardbasedproposalforunifiedsinglesignon:
  idioma: en
  resumen: 'During last years, service federation has been a hot topic for researchers all along the world. In that context, single sign on (SSO) access to services has risen as a major concern for this kind of environments and many proposals suited to several scenarios have been stated. We can think of eduroam an eduGAIN as two major examples of this, the former as a federated initiative to provide access to network and the latter as a confederated proposal to provide secure access to Web (and non-web as grid) resources. Given that both architectures usually are deployed in a common security domain, it could be interesting to explore ways to bring both worlds together, that is, to find a way to get access as we get access to the network services. Currently, there are two disjoint actions: first get access to network, with its own authentication process, and second get access to other resources through eduGAIN. The process could be greatly simplified if a way is devised to unify both accesses
    what has been called unified Single Sing On (uSSO). In this work, we propose a novel framework to provide uSSO in that environment with minor modifications to existing deployments employing Infocard Technology.'
applyinganunifiedaccesscontrolforiotbasedintelligentagentsys:
  idioma: en
  resumen: The rise of the Internet of Things (IoT) paradigm has allowed the design and development of new services interconnecting heterogeneous devices. However, the complexity of these new systems hasn't been followed by the increase of intelligence and reasoning of the devices connected. On the other hand, intelligent agent systems have developed precisely these characteristics so the combination of both paradigms by modelling intelligent agents in IoT devices is a very promising approach that will enable a more powerful and smart IoT. The interconnection of agents through a Internet-based network implies addressing critical issues that affect all network communications, such as security, privacy and access control, specially given the sensitivity of the information exchanged by agents. In this paper, we propose the application of User-Managed Access (UMA) to provide an unified access control schema for an heterogeneous hybrid architecture of IoT devices and intelligent agents.
aregionbasedmultiissuenegotiationprotocolfornonmonotonicutil:
  idioma: en
  resumen: Nonmonotonic utility spaces are found in multi‐issue negotiations where the preferences on the issues yield multiple local optima. These negotiations are specially challenging because of the inherent complexity of the search space and the difficulty of learning the opponent’s preferences. Most current solutions successfully address moderately complex preference scenarios, while solutions intended to operate in highly complex spaces are constrained by very specific preference structures. To overcome these problems, we propose the Region‐Based Multi‐issue Negotiation Protocol (RBNP) for bilateral automated negotiation. RBNP is built upon a nonmediated recursive bargaining mechanism which efficiently modulates a region‐based joint exploration of the solution space. We empirically show that RBNP produces outcomes close to the Pareto frontier in reasonable negotiation times, and show that it provides a significantly better performance when compared to a generic Similarity‐Based Multi‐issue
    Negotiation Protocol (SBNP), which has been successfully used in many negotiation models. We have paid attention to the strategic issues, proposing and evaluating several concession mechanisms, and analyzing the equilibrium conditions. Results suggest that RBNP may be used as a basis to develop negotiation mechanisms in nonmonotonic utility spaces.
automatednegotiationforresourceassignmentinwirelesssurveilla:
  idioma: en
  resumen: Due to the low cost of CMOS IP-based cameras, wireless surveillance sensor networks have emerged as a new application of sensor networks able to monitor public or private areas or even country borders. Since these networks are bandwidth intensive and the radioelectric spectrum is limited, especially in unlicensed bands, it is mandatory to assign frequency channels in a smart manner. In this work, we propose the application of automated negotiation techniques for frequency assignment. Results show that these techniques are very suitable for the problem, being able to obtain the best solutions among the techniques with which we have compared them.
