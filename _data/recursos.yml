# Recursos docentes, agrupados por asignatura y tema. Cada recurso es un HTML
# autocontenido dentro de docencia/<asignatura>/…; aquí solo se describe.
# Con añadir una entrada aparece en la página de la asignatura y en /recursos/.
#
#   - titulo:         (obligatorio)
#     url:            ruta del HTML (obligatorio)
#     descripcion:    una o dos frases
#     imagen:         captura para la tarjeta (720 px de ancho), en assets/img/recursos/
#     sesion:         "2.1" (se muestra «Sesión 2.1»)
#     etiqueta:       texto libre en lugar de la sesión, p. ej. «Laboratorio 1.2»
#     en:             ruta de la versión en inglés, si existe
#     tipo:           «video» para los vídeos de YouTube (su página la crea
#                     scripts/importar_video.py; imagen = miniatura de YouTube)
#     titulo_en:      título en inglés (para /en/)
#     descripcion_en: descripción en inglés (para /en/)
#     etiqueta_en:    equivalente en inglés de «etiqueta»
#
# Un recurso sin «en» sale también en las páginas en inglés (/en/teaching/…),
# enlazando la versión en español y con la nota «Spanish only».

ar1:
  - tema: 1
    recursos:
      - titulo: Codificación de línea y tiempo de bit
        url: /docencia/ar1/retardos/codificacion-tiempo-de-bit.html
        imagen: /assets/img/recursos/codificacion-tiempo-de-bit.jpg
        en: /docencia/ar1/retardos/codificacion-tiempo-de-bit-en.html
        titulo_en: Line coding and bit time
        sesion: "1.1"
        descripcion: Codifica una trama en NRZ-L, NRZ-I o Manchester y observa que cada bit ocupa el enlace un tiempo fijo, 1/R. De ahí sale el retardo de transmisión, L/R.
        descripcion_en: Encode a frame in NRZ-L, NRZ-I or Manchester and see that every bit occupies the link for a fixed time, 1/R. That is where the transmission delay, L/R, comes from.
      - titulo: "Retardos de transmisión y propagación: diagrama espacio-tiempo"
        url: /docencia/ar1/retardos/retardos-espacio-tiempo.html
        imagen: /assets/img/recursos/retardos-espacio-tiempo.jpg
        en: /docencia/ar1/retardos/retardos-espacio-tiempo-en.html
        titulo_en: "Transmission and propagation delay: space-time diagram"
        sesion: "1.1"
        descripcion: Ajusta tamaño, tasa, distancia y velocidad de propagación y sigue los paquetes entre emisor y receptor. Compara parada y espera con pipelining y la utilización del emisor.
        descripcion_en: Adjust size, rate, distance and propagation speed and follow the packets between sender and receiver. Compare stop-and-wait with pipelining and the sender's utilization.
      - titulo: Comunicación lógica y comunicación real
        url: /docencia/ar1/capas/capas_logica_vs_real.html
        imagen: /assets/img/recursos/capas_logica_vs_real.jpg
        en: /docencia/ar1/capas/layers_logical_vs_real.html
        titulo_en: Logical vs real communication
        sesion: "1.2"
        descripcion: Cada capa cree que habla directamente con su par, pero todo baja y sube por la pila. Recorre servicio, protocolo e interfaz y descubre quién lee cada cabecera de la trama.
        descripcion_en: Every layer believes it talks directly to its peer, but everything actually goes up and down the stack. Walk through service, protocol and interface and find out who reads each header in the frame.
      - titulo: Colas y descartes en un router
        url: /docencia/ar1/colas/conmutacion_paquetes_colas.html
        imagen: /assets/img/recursos/conmutacion_paquetes_colas.jpg
        en: /docencia/ar1/colas/queueing_drops_router.html
        titulo_en: Queueing and packet drops in a router
        sesion: "1.3"
        descripcion: Varios orígenes comparten un enlace de salida. Sube la intensidad de tráfico ρ = λ·L/R y mira cómo crece la cola, se llena el buffer y el router empieza a descartar paquetes.
        descripcion_en: Several sources share one outgoing link. Raise the traffic intensity ρ = λ·L/R and watch the queue grow, the buffer fill up, and the router start dropping packets.
      - titulo: Diagrama de retardos
        url: /docencia/ar1/retardos/diagrama-retardos.html
        imagen: /assets/img/recursos/diagrama-retardos.jpg
        en: /docencia/ar1/retardos/diagrama-retardos-en.html
        titulo_en: Delay diagram
        sesion: "1.3"
        descripcion: Dibuja a escala tramas y ACK entre dos extremos y decide cuándo empieza cada uno. Mide en las cotas los retardos de transmisión y de propagación y exporta el diagrama en SVG o PNG.
        descripcion_en: Draw frames and ACKs between two ends to scale and decide when each one starts. Read the transmission and propagation delays off the dimension lines and export the diagram as SVG or PNG.
      - titulo: "El núcleo de la red: por qué se corta tu videollamada con fibra de 1 Gbps"
        url: /docencia/ar1/videos/nucleo-de-la-red/
        tipo: video
        imagen: https://i.ytimg.com/vi/bGAw3Hwm4-c/maxresdefault.jpg
        en: /en/teaching/ar1/videos/network-core/
        titulo_en: "The network core: why your video call drops on 1 Gbps fibre"
        sesion: "1.3"
        descripcion: Episodio de 30 minutos de la sesión 1.3. Conmutación de circuitos y de paquetes, cómo está organizada Internet por dentro (ISP, IXP, peering), los cuatro retardos, colas, pérdidas y caudal.
        descripcion_en: A 30-minute episode for session 1.3. Circuit and packet switching, how the Internet is organized inside (ISPs, IXPs, peering), the four delays, queues, losses and throughput.

  - tema: 1
    titulo: laboratorio de retardos
    titulo_en: delay lab
    indice: /docencia/ar1/lab-retardos/
    indice_en: /en/teaching/ar1/delay-lab/
    recursos:
      - titulo: Anatomía del retardo
        url: /docencia/ar1/lab-retardos/01-anatomia-del-retardo.html
        imagen: /assets/img/recursos/01-anatomia-del-retardo.jpg
        en: /docencia/ar1/lab-retardos/01-anatomy-of-delay.html
        titulo_en: Anatomy of delay
        etiqueta: Laboratorio 1.2, problema P6
        etiqueta_en: Lab 1.2, problem P6
        descripcion: Transmisión frente a propagación, dónde están el primer y el último bit, el punto de equilibrio y una calculadora para cualquier enunciado.
        descripcion_en: Transmission versus propagation, where the first and last bit are, the equilibrium point, and a calculator for any problem statement.
      - titulo: La tubería y el ancho de un bit
        url: /docencia/ar1/lab-retardos/02-tuberia-ancho-de-bit.html
        imagen: /assets/img/recursos/02-tuberia-ancho-de-bit.jpg
        en: /docencia/ar1/lab-retardos/02-pipe-bit-width.html
        titulo_en: The pipe and the width of a bit
        etiqueta: Laboratorio 1.2, problemas P25 a P27
        etiqueta_en: Lab 1.2, problems P25 to P27
        descripcion: Producto ancho de banda por retardo, bits en vuelo, ancho de un bit y comparación entre 2 Mbps y 1 Gbps.
        descripcion_en: Bandwidth-delay product, bits in flight, the width of a bit, and a comparison between 2 Mbps and 1 Gbps.
      - titulo: Envío continuo frente a parada y espera
        url: /docencia/ar1/lab-retardos/03-continuo-vs-parada-y-espera.html
        imagen: /assets/img/recursos/03-continuo-vs-parada-y-espera.jpg
        en: /docencia/ar1/lab-retardos/03-continuous-vs-stop-and-wait.html
        titulo_en: Continuous transmission vs. stop-and-wait
        etiqueta: Laboratorio 1.2, problema P28
        etiqueta_en: Lab 1.2, problem P28
        descripcion: Un mensaje grande frente a 20 paquetes con reconocimiento, la utilización del enlace y el coste del RTT.
        descripcion_en: One large message versus 20 acknowledged packets, link utilization, and the cost of the RTT.

  - tema: 2
    titulo: DNS
    titulo_en: DNS
    indice: /docencia/ar1/dns/
    indice_en: /en/teaching/ar1/dns/
    recursos:
      - titulo: "Anatomía de un nombre: de las etiquetas al árbol"
        url: /docencia/ar1/dns/dns_nombres.html
        imagen: /assets/img/recursos/dns_nombres.jpg
        sesion: "2.1"
        descripcion: Descompón cualquier nombre en etiquetas y dominios y míralo en el árbol, desde la raíz o desde el nombre. Comprueba las reglas, 63 caracteres, punto final, mayúsculas y punycode.
        # Sin versión en inglés todavía.
      - titulo: "Delegación de zonas: ceder una rama del árbol"
        url: /docencia/ar1/dns/dns_delegacion.html
        imagen: /assets/img/recursos/dns_delegacion.jpg
        en: /docencia/ar1/dns/dns_delegation_en.html
        titulo_en: DNS zone delegation
        sesion: "2.1"
        descripcion: Paso a paso de la cadena IANA → Red.es → UAH → Departamento, con los ficheros de zona. En «Delega tú» creas dominios y hosts y los cedes tú mismo, con NS, pegamento y referencias.
        descripcion_en: Step by step through the IANA → Red.es → UAH → Department chain, with zone files. In "Delegate it yourself" you create domains and hosts and delegate them yourself, with NS records, glue and referrals.
      - titulo: "Consultas DNS: iterativa y recursiva"
        url: /docencia/ar1/dns/dns_consultas.html
        imagen: /assets/img/recursos/dns_consultas.jpg
        en: /docencia/ar1/dns/dns_queries_en.html
        titulo_en: "DNS queries: iterative and recursive"
        sesion: "2.1"
        descripcion: Mensaje a mensaje, la resolución de gaia.cs.umass.edu con la caché vacía. Compara los dos modos y fíjate en quién tiene que recordar consultas ajenas.
        descripcion_en: Message by message, resolving gaia.cs.umass.edu with an empty cache. Compare the two modes and notice who has to remember other people's queries.
      - titulo: "Consultas DNS: decide tú quién es recursivo"
        url: /docencia/ar1/dns/dns_consultas_mixtas.html
        imagen: /assets/img/recursos/dns_consultas_mixtas.jpg
        en: /docencia/ar1/dns/dns_queries_mixed_en.html
        titulo_en: "DNS queries: you decide who is recursive"
        sesion: "2.1"
        descripcion: La misma resolución, pero tú eliges si el servidor local, la raíz, el TLD y el autoritativo atienden de forma recursiva o iterativa. Compara quién envía las consultas, quién tiene que esperar y dónde acaba la respuesta en caché.
        descripcion_en: The same resolution, but you choose whether the local server, the root, the TLD and the authoritative server work recursively or iteratively. Compare who sends the queries, who has to wait and where the answer ends up cached.
      - titulo: DNS paso a paso
        url: /docencia/ar1/dns/dns_paso_a_paso.html
        imagen: /assets/img/recursos/dns_paso_a_paso.jpg
        en: /docencia/ar1/dns/dns_step_by_step_en.html
        titulo_en: DNS step by step
        sesion: "2.2"
        descripcion: El DNS contado desde el porqué en 27 pasos, de por qué la IP no basta al recorrido de una consulta mensaje a mensaje. Por qué hacen falta nombres, cómo se reparte el árbol, qué ve tu equipo y qué pasa detrás, y dónde es recursiva o iterativa cada consulta.
        descripcion_en: The DNS told from the why in 27 steps, from why an IP address is not enough to a query followed message by message. Why we need names, how the tree is split up, what your computer sees and what happens behind it, and where each query is recursive or iterative.

  - tema: 2
    titulo: HTTP
    titulo_en: HTTP
    recursos:
      - titulo: "HTTP persistente: sin y con canalización"
        url: /docencia/ar1/http/http-persistente.html
        imagen: /assets/img/recursos/http-persistente.jpg
        en: /docencia/ar1/http/http-persistente-en.html
        titulo_en: "Persistent HTTP: without and with pipelining"
        sesion: "2.2"
        descripcion: Una página con N objetos descargada por una única conexión TCP persistente. Compara a la misma escala los diagramas de retardos sin y con canalización, mira cuándo se queda ocioso el enlace y practica con ejercicios aleatorios.
        descripcion_en: A page with N objects downloaded over a single persistent TCP connection. Compare the delay diagrams without and with pipelining on the same time scale, see when the link sits idle and practise with random exercises.
