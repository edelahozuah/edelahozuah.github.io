# Recursos docentes, agrupados por asignatura y tema. Cada recurso es un HTML
# autocontenido dentro de docencia/<asignatura>/…; aquí solo se describe.
# Con añadir una entrada aparece en la página de la asignatura y en /recursos/.
#
#   - titulo:       (obligatorio)
#     url:          ruta del HTML (obligatorio)
#     descripcion:  una o dos frases
#     imagen:       captura para la tarjeta (720 px de ancho), en assets/img/recursos/
#     sesion:       "2.1" (se muestra «Sesión 2.1»)
#     etiqueta:     texto libre en lugar de la sesión, p. ej. «Laboratorio 1.2»
#     en:           ruta de la versión en inglés, si existe
#     titulo_en:    título en inglés (para /en/)

ar1:
  - tema: 1
    recursos:
      - titulo: Codificación de línea y tiempo de bit
        url: /docencia/ar1/retardos/codificacion-tiempo-de-bit.html
        imagen: /assets/img/recursos/codificacion-tiempo-de-bit.jpg
        en: /docencia/ar1/retardos/codificacion-tiempo-de-bit-en.html
        titulo_en: Line coding and bit time
        sesion: "1.1"
        descripcion: Codifica una trama en NRZ-L, NRZ-I o Manchester y observa que cada bit ocupa el enlace un tiempo fijo, 1/R. De ahí sale el retardo de transmisión, L/R.
      - titulo: "Retardos de transmisión y propagación: diagrama espacio-tiempo"
        url: /docencia/ar1/retardos/retardos-espacio-tiempo.html
        imagen: /assets/img/recursos/retardos-espacio-tiempo.jpg
        en: /docencia/ar1/retardos/retardos-espacio-tiempo-en.html
        titulo_en: "Transmission and propagation delay: space-time diagram"
        sesion: "1.1"
        descripcion: Ajusta tamaño, tasa, distancia y velocidad de propagación y sigue los paquetes entre emisor y receptor. Compara parada y espera con pipelining y la utilización del emisor.
      - titulo: Comunicación lógica y comunicación real
        url: /docencia/ar1/capas/capas_logica_vs_real.html
        imagen: /assets/img/recursos/capas_logica_vs_real.jpg
        en: /docencia/ar1/capas/layers_logical_vs_real.html
        titulo_en: Logical vs real communication
        sesion: "1.2"
        descripcion: Cada capa cree que habla directamente con su par, pero todo baja y sube por la pila. Recorre servicio, protocolo e interfaz y descubre quién lee cada cabecera de la trama.
      - titulo: Colas y descartes en un router
        url: /docencia/ar1/colas/conmutacion_paquetes_colas.html
        imagen: /assets/img/recursos/conmutacion_paquetes_colas.jpg
        en: /docencia/ar1/colas/queueing_drops_router.html
        titulo_en: Queueing and packet drops in a router
        sesion: "1.3"
        descripcion: Varios orígenes comparten un enlace de salida. Sube la intensidad de tráfico ρ = λ·L/R y mira cómo crece la cola, se llena el buffer y el router empieza a descartar paquetes.

  - tema: 1
    titulo: laboratorio de retardos
    indice: /docencia/ar1/lab-retardos/
    recursos:
      - titulo: Anatomía del retardo
        url: /docencia/ar1/lab-retardos/01-anatomia-del-retardo.html
        imagen: /assets/img/recursos/01-anatomia-del-retardo.jpg
        en: /docencia/ar1/lab-retardos/01-anatomy-of-delay.html
        titulo_en: Anatomy of delay
        etiqueta: Laboratorio 1.2, problema P6
        descripcion: Transmisión frente a propagación, dónde están el primer y el último bit, el punto de equilibrio y una calculadora para cualquier enunciado.
      - titulo: La tubería y el ancho de un bit
        url: /docencia/ar1/lab-retardos/02-tuberia-ancho-de-bit.html
        imagen: /assets/img/recursos/02-tuberia-ancho-de-bit.jpg
        en: /docencia/ar1/lab-retardos/02-pipe-bit-width.html
        titulo_en: The pipe and the width of a bit
        etiqueta: Laboratorio 1.2, problemas P25 a P27
        descripcion: Producto ancho de banda por retardo, bits en vuelo, ancho de un bit y comparación entre 2 Mbps y 1 Gbps.
      - titulo: Envío continuo frente a parada y espera
        url: /docencia/ar1/lab-retardos/03-continuo-vs-parada-y-espera.html
        imagen: /assets/img/recursos/03-continuo-vs-parada-y-espera.jpg
        en: /docencia/ar1/lab-retardos/03-continuous-vs-stop-and-wait.html
        titulo_en: Continuous transmission vs. stop-and-wait
        etiqueta: Laboratorio 1.2, problema P28
        descripcion: Un mensaje grande frente a 20 paquetes con reconocimiento, la utilización del enlace y el coste del RTT.

  - tema: 2
    titulo: DNS
    indice: /docencia/ar1/dns/
    recursos:
      - titulo: "Anatomía de un nombre: de las etiquetas al árbol"
        url: /docencia/ar1/dns/dns_nombres.html
        imagen: /assets/img/recursos/dns_nombres.jpg
        sesion: "2.1"
        descripcion: Descompón cualquier nombre en etiquetas y dominios y míralo en el árbol, desde la raíz o desde el nombre. Comprueba las reglas, 63 caracteres, punto final, mayúsculas y punycode.
      - titulo: "Delegación de zonas: ceder una rama del árbol"
        url: /docencia/ar1/dns/dns_delegacion.html
        imagen: /assets/img/recursos/dns_delegacion.jpg
        en: /docencia/ar1/dns/dns_delegation_en.html
        titulo_en: DNS zone delegation
        sesion: "2.1"
        descripcion: Paso a paso de la cadena IANA → Red.es → UAH → Departamento, con los ficheros de zona. En «Delega tú» creas dominios y hosts y los cedes tú mismo, con NS, pegamento y referencias.
      - titulo: "Consultas DNS: iterativa y recursiva"
        url: /docencia/ar1/dns/dns_consultas.html
        imagen: /assets/img/recursos/dns_consultas.jpg
        en: /docencia/ar1/dns/dns_queries_en.html
        titulo_en: "DNS queries: iterative and recursive"
        sesion: "2.1"
        descripcion: Mensaje a mensaje, la resolución de gaia.cs.umass.edu con la caché vacía. Compara los dos modos y fíjate en quién tiene que recordar consultas ajenas.
