# Asignaturas que se muestran en /docencia/ y /en/teaching/. Las que tienen
# «pagina» enlazan a su página de recursos; para añadir una, crea
# docencia/<id>/index.md (copia la de ar1) y sus recursos en _data/recursos.yml.
# «pagina_en» es la página equivalente en inglés (solo si existe).
- id: ar1
  nombre: Arquitectura de Redes I
  nombre_en: Network Architecture I
  pagina: /docencia/ar1/
  pagina_en: /en/teaching/ar1/
  # «descripcion» y «descripcion_en» se usan en los datos estructurados (Course).
  descripcion: Asignatura de los grados de Telecomunicación e Informática de la Universidad de Alcalá sobre la arquitectura de las redes de comunicaciones. Estudia retardos, capas y encapsulado, conmutación de paquetes y colas, y el DNS. Se imparte también, con el mismo contenido y los mismos exámenes, como Arquitectura de Redes en los grados de Ingeniería Informática y de Ingeniería de Computadores.
  descripcion_en: Course in the Telecommunication and Computer Engineering degrees at the University of Alcalá on the architecture of communication networks. It covers delays, layering and encapsulation, packet switching and queueing, and DNS. It is also taught, with the same content and exams, as Network Architecture in the Computer Engineering degrees.
- id: ar
  nombre: Arquitectura de Redes
  nombre_en: Network Architecture
  # Asignatura hermana de Arquitectura de Redes I (mismo contenido y mismos
  # exámenes) en los grados de Informática; «recursos_de» hace que enlace a la
  # página y los recursos de ar1 sin duplicarlos.
  recursos_de: ar1
  pagina: /docencia/ar1/
  pagina_en: /en/teaching/ar1/
  nivel: Grados en Ingeniería Informática y en Ingeniería de Computadores; misma asignatura que Arquitectura de Redes I
  nivel_en: Computer Engineering degrees; same course as Network Architecture I
- id: ar2
  nombre: Arquitectura de Redes II
  nombre_en: Network Architecture II
- id: redes
  nombre: Redes de Computadores
  nombre_en: Computer Networks
- id: seguridad
  nombre: Seguridad
  nombre_en: Security
  pagina: /docencia/seguridad/
  pagina_en: /en/teaching/seguridad/
  descripcion: Asignatura de los grados en Ingeniería Telemática, Ingeniería Informática e Ingeniería de Computadores de la Universidad de Alcalá sobre seguridad de redes y sistemas. Las prácticas se hacen sobre escenarios de red emulados con Kathara.
  descripcion_en: Course in the Telematics, Computer Science and Computer Engineering degrees at the University of Alcalá on network and systems security. Lab sessions run on network scenarios emulated with Kathara.
- id: ddss
  nombre: Diseño y Desarrollo de Sistemas Seguros
  nombre_en: Design and Development of Secure Systems
  nivel: Máster Universitario en Ciberseguridad
  nivel_en: Master's Degree in Cybersecurity
