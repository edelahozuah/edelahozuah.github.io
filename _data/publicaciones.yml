  titulo: Applying an unified access control for IoT-based Intelligent Agent Systems
  anio: 2015
  categoria: congreso
  medio: 2015 IEEE 8th International Conference on Service-Oriented Computing and Applications (Soca)
  autores:
  - Diego Rivera
  - Luis Cruz-Piris
  - German Lopez-Civera
  - Enrique de la Hoz
  - Ivan Marsa-Maestre
  - IEEE
  doi: 10.1109/soca.2015.40
  citas: 64
  scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=HBXLJGoAAAAJ&pagesize=100&sortby=pubdate&citation_for_view=HBXLJGoAAAAJ:dhFuZR0502QC
  abr: SOCA
  pdf: /publicaciones/applyinganunifiedaccesscontrolforiotbasedintelligentagentsys/applying-unified-access-control-iot-2015.pdf
  resumen: The rise of the Internet of Things (IoT) paradigm has allowed the design and development of new services interconnecting heterogeneous devices. However, the complexity of these new systems hasn't been followed by the increase of intelligence and reasoning of the devices connected. On the other hand, intelligent agent systems have developed precisely these characteristics so the combination of both paradigms by modelling intelligent agents in IoT devices is a very promising approach that will enable a more powerful and smart IoT. The interconnection of agents through a Internet-based network implies addressing critical issues that affect all network communications, such as security, privacy and access control, specially given the sensitivity of the information exchanged by agents. In this paper, we propose the application of User-Managed Access (UMA) to provide an unified access control schema for an heterogeneous hybrid architecture of IoT devices and intelligent agents.
