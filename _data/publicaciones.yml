- id: accesscontrolmechanismforiotenvironmentsbasedonmodellingcomm
  titulo: Access Control Mechanism for IoT Environments Based on Modelling Communication Procedures as Resources
  anio: 2018
  categoria: revista
  medio: Sensors
  autores:
  - Luis Cruz-Piris
  - Diego Rivera
  - Ivan Marsa-Maestre
  - Enrique De la Hoz
  - Juan Velasco
  doi: 10.3390/s18030917
  citas: 100
  scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=HBXLJGoAAAAJ&pagesize=100&sortby=pubdate&citation_for_view=HBXLJGoAAAAJ:R3hNpaxXUhUC
  abr: Sensors
  pdf: /publicaciones/accesscontrolmechanismforiotenvironmentsbasedonmodellingcomm/access-control-mechanism-iot-environments-2018.pdf
  destacada: true
  resumen: Internet growth has generated new types of services where the use of sensors and actuators is especially remarkable. These services compose what is known as the Internet of Things (IoT). One of the biggest current challenges is obtaining a safe and easy access control scheme for the data managed in these services. We propose integrating IoT devices in an access control system designed for Web-based services by modelling certain IoT communication elements as resources. This would allow us to obtain a unified access control scheme between heterogeneous devices (IoT devices, Internet-based services, etc.). To achieve this, we have analysed the most relevant communication protocols for these kinds of environments and then we have proposed a methodology which allows the modelling of communication actions as resources. Then, we can protect these resources using access control mechanisms. The validation of our proposal has been carried out by selecting a communication protocol based
    on message exchange, specifically Message Queuing Telemetry Transport (MQTT). As an access control scheme, we have selected User-Managed Access (UMA), an existing Open Authorization (OAuth) 2.0 profile originally developed for the protection of Internet services. We have performed tests focused on validating the proposed solution in terms of the correctness of the access control system. Finally, we have evaluated the energy consumption overhead when using our proposal.
  resumen_idioma: en
- id: onthegoodnessofusingorthogonalchannelsinwlanieee80211inreali
  titulo: On the Goodness of Using Orthogonal Channels in WLAN IEEE 802.11 in Realistic Scenarios
  anio: 2018
  categoria: revista
  medio: Wireless Communications and Mobile Computing
  autores:
  - Jose Manuel Gimenez-Guzman
  - Ivan Marsa-Maestre
  - David Orden
  - Enrique de la Hoz
  - Takayuki Ito
  - Laurie Cuthbert
  doi: 10.1155/2018/5742712
  citas: 14
  scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=HBXLJGoAAAAJ&pagesize=100&sortby=pubdate&citation_for_view=HBXLJGoAAAAJ:RHpTSmoSYBkC
  abr: WCMC
  pdf: /publicaciones/onthegoodnessofusingorthogonalchannelsinwlanieee80211inreali/goodness-orthogonal-channels-wlan-ieee-2018.pdf
  resumen: Due to the high density of Wi‐Fi networks, especially in the unlicensed 2.4 GHz frequency band, channel assignment has become a critical duty for achieving a satisfactory user experience. Probably, the main peculiarity of Wi‐Fi networks is the partial overlap of the radio channels that can be used by access points. For that reason, a number of works avoid cochannel interferences by using only channels which are far enough from each other to have no interferences, the so‐called orthogonal channels. However, there is a range of choices between using the whole spectrum and using only orthogonal channels. In this work we evaluate the influence of the choice of channel set in realistic settings, using both optimization and heuristic approaches. Results show that the optimizer is not able to achieve better results when using the whole spectrum instead of restricting to only the orthogonal channels. In fact, the optimizer uses mainly the orthogonal channels when they are available, while
    the heuristics considered lose performance when more channels are available. We believe this insight will be useful to design new heuristics for Wi‐Fi channel assignment.
  resumen_idioma: en
- id: spectrumgraphcoloringandapplicationstowifichannelassignment
  titulo: Spectrum Graph Coloring and Applications to Wi-Fi Channel Assignment
  anio: 2018
  categoria: revista
  medio: Symmetry
  autores:
  - David Orden
  - Jose Gimenez-Guzman
  - Ivan Marsa-Maestre
  - Enrique De la Hoz
  doi: 10.3390/sym10030065
  citas: 42
  scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=HBXLJGoAAAAJ&pagesize=100&sortby=pubdate&citation_for_view=HBXLJGoAAAAJ:QIV2ME_5wuYC
  abr: Symmetry
  arxiv: '1602.05038'
  pdf: /publicaciones/spectrumgraphcoloringandapplicationstowifichannelassignment/spectrum-graph-coloring-applications-wi-2018.pdf
  resumen: We introduce and explore a family of vertex-coloring problems, which, surprisingly enough, have not been considered before despite stemming from the problem of Wi-Fi channel assignment. Given a spectrum of colors, endowed with a matrix of interferences between each pair of colors, the Threshold Spectrum Coloring problem fixes the number of colors available and aims to minimize the interference threshold, i.e., the maximum of the interferences at the vertices. Conversely, the Chromatic Spectrum Coloring problem fixes a threshold and aims to minimize the number of colors for which respecting that threshold is possible. As the main theoretical results, we prove tight upper bounds for the solutions to each problem. Since both problems turn out to be NP-hard, we complete the scene with experimental results. We propose a DSATUR-based heuristic and study its performance to minimize the maximum vertex interference in Wi-Fi channel assignment, both for randomly-generated graphs and for
    a real-world scenario. Further, for all these graphs, we experimentally check the goodness of the theoretical bounds.
  resumen_idioma: en
