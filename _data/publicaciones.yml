- id: strategiesforoffergenerationandrelaxationinfuzzyconstraintba
  titulo: Strategies for offer generation and relaxation in fuzzy constraint-based negotiation models
  anio: 2010
  categoria: revista
  medio: Multiagent and Grid Systems
  autores:
  - M.A. Lopez-Carmona
  - I. Marsa-Maestre
  - J.R. Velasco
  - E. De la Hoz
  - B. Alarcos
  doi: 10.3233/mgs-2010-0163
  abr: MAGS
  pdf: /publicaciones/strategiesforoffergenerationandrelaxationinfuzzyconstraintba/strategies-offer-generation-relaxation-fuzzy-2010.pdf
  resumen: Fuzzy constraints have been used in several automated multi-attribute negotiation models. It is recognized that fuzzy constraints represent an efficient way of capturing requirements and preferences, and an useful mechanism for representing trade-offs. Most approaches are mainly focused on using co nstraints as a framework for describing preferences, and few works focus on using them as an element in the communication process itself in order to elaborate efficient negotiation strategies. This paper proposes and evaluates a set of strategies for offer generation and for the construction of offer relaxation requests in constraint-based negotiation models. To deploy the strategies, a fuzzy constraint based model for non-mediated bilateral automated purchase negotiations has been used. Fuzzy constraints are used both to represent preferences and to express offers. A set of locutions and decision mechanisms which trigger them are fully specified, where each agent may decide its degree
    of cooperation and its degree of expressiveness. Expressiveness is based on the propagation of constraints and relaxation requests. The paper analyzes which combination of different agents' attitudes allow to improve the negotiation processes. Experimental evaluation confirms the advantage of an expressive approach based on the propagation of constraints. In addition, this paper studies how applying a clustering algorithm to the seller's catalogue of products instead of managing single products may contribute to an improvement in the duration of the negotiation dialogues, and to a significant improvement on the utility of the deals that are achieved. These results support the usefulness of the proposed negotiation strategies.
  resumen_idioma: en
- id: usingrfidtoenhancesecurityinoffsitedatastorage
  titulo: Using RFID to enhance security in off-site data storage.
  anio: 2010
  categoria: revista
  medio: Sensors
  autores:
  - Lopez-Carmona MA
  - Marsa-Maestre I
  - de la Hoz E
  - Velasco JR
  doi: 10.3390/s100908010
  citas: 6
  scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=HBXLJGoAAAAJ&pagesize=100&sortby=pubdate&citation_for_view=HBXLJGoAAAAJ:9yKSN-GCB0IC
  abr: Sensors
  pdf: /publicaciones/usingrfidtoenhancesecurityinoffsitedatastorage/rfid-enhance-security-off-site-2010.pdf
  resumen: Off-site data storage is one of the most widely used strategies in enterprises of all sizes to improve business continuity. In medium-to-large size enterprises, the off-site data storage processes are usually outsourced to specialized providers. However, outsourcing the storage of critical business information assets raises serious security considerations, some of which are usually either disregarded or incorrectly addressed by service providers. This article reviews these security considerations and presents a radio frequency identification (RFID)-based, off-site, data storage management system specifically designed to address security issues. The system relies on a set of security mechanisms or controls that are arranged in security layers or tiers to balance security requirements with usability and costs. The system has been successfully implemented, deployed and put into production. In addition, an experimental comparison with classical bar-code-based systems is provided,
    demonstrating the system's benefits in terms of efficiency and failure prevention.
  resumen_idioma: en
