<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización Aloha Puro (Paso Atrás - Fix)</title> <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos generales y layout (sin cambios) */
        html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; }
        #controls-sidebar { width: 320px; flex-shrink: 0; }
        #main-content { flex-grow: 1; display: flex; flex-direction: column; }
        #canvas-container { flex-grow: 1; overflow-x: auto; overflow-y: hidden; padding: 1rem; background-color: #f0f4f8; border-radius: 0.5rem; margin: 1rem; }
        canvas { border: 1px solid #d1d5db; background-color: #ffffff; display: block; }
        .input-group label { min-width: 140px; }
        .input-group label.backoff-label { min-width: auto; margin-left: 5px; }
        .input-group textarea.backoff-list-input { min-width: 100px; }
        button { transition: background-color 0.3s ease; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        /* Clases de color */
        .station-a { background-color: rgba(59, 130, 246, 0.7); border: 1px solid #1d4ed8; color: #1d4ed8 }
        .station-b { background-color: rgba(234, 179, 8, 0.7); border: 1px solid #a16207; color: #a16207; }
        .station-c { background-color: rgba(34, 197, 94, 0.7); border: 1px solid #15803d; color: #15803d; }
        .station-d { background-color: rgba(249, 115, 22, 0.7); border: 1px solid #c2410c; color: #c2410c; }
        .collision-flag { background-color: rgba(239, 68, 68, 0.8); border: 1px solid #b91c1c; }
        .collided-status { background-color: rgba(220, 38, 38, 0.9); border: 1px solid #991b1b; color: #991b1b; }
        .successful { background-color: rgba(134, 239, 172, 0.7); border: 1px solid #16a34a; color: #16a34a; }
        .dropped { background-color: rgba(156, 163, 175, 0.7); border: 1px solid #4b5563; color: #4b5563; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen">

    <div id="controls-sidebar" class="bg-white p-5 overflow-y-auto shadow-lg h-full">
        <h1 class="text-xl md:text-2xl font-bold mb-5 text-center text-gray-800">Simulador Aloha</h1>
        <div class="mb-6 p-4 border rounded-lg bg-gray-50">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">Parámetros</h2>
             <div class="space-y-3">
                <div class="flex items-center space-x-2 input-group"> <label for="transmissionSlots" class="text-sm text-gray-600">T<sub>t</sub> (Slots):</label> <input type="number" id="transmissionSlots" value="5" min="1" class="w-16 param-input text-sm"> </div>
                <div class="flex items-center space-x-2 input-group"> <label for="propagationSlots" class="text-sm text-gray-600">T<sub>p</sub> (Slots):</label> <input type="number" id="propagationSlots" value="1" min="0" class="w-16 param-input text-sm"> </div>
                <div class="flex items-center space-x-2 input-group"> <label for="maxSlots" class="text-sm text-gray-600">Max Slots:</label> <input type="number" id="maxSlots" value="60" min="10" class="w-16 param-input text-sm"> </div>
                <div class="flex items-center space-x-2 input-group"> <label for="maxRetransmissions" class="text-sm text-gray-600">Max Intentos:</label> <input type="number" id="maxRetransmissions" value="5" min="1" class="w-16 param-input text-sm"> </div>
            </div>
        </div>
        <div class="mb-6 p-4 border rounded-lg bg-gray-50">
             <h2 class="text-lg font-semibold text-gray-700 mb-3">Estaciones</h2>
             <p class="text-xs text-gray-500 mb-3">Inicios y Backoffs (separados por comas).</p>
             <div class="space-y-3">
                 <div class="input-group"> <label for="stationA" class="block text-sm text-blue-600 mb-1">A (Inicios):</label> <textarea id="stationA" rows="1" class="w-full param-input text-sm" placeholder="Ej: 0, 15">0, 29</textarea> <label for="backoffListA" class="block text-xs text-gray-600 mt-1 mb-1">Backoffs A:</label> <textarea id="backoffListA" rows="1" class="w-full backoff-list-input param-input text-sm" placeholder="Ej: 10, 25">10,6,3,14,9</textarea> </div>
                 <div class="input-group"> <label for="stationB" class="block text-sm text-yellow-600 mb-1">B (Inicios):</label> <textarea id="stationB" rows="1" class="w-full param-input text-sm" placeholder="Ej: 5, 25">8</textarea> <label for="backoffListB" class="block text-xs text-gray-600 mt-1 mb-1">Backoffs B:</label> <textarea id="backoffListB" rows="1" class="w-full backoff-list-input param-input text-sm" placeholder="Ej: 8, 18">6,8,8,17,20</textarea> </div>
                 <div class="input-group"> <label for="stationC" class="block text-sm text-green-600 mb-1">C (Inicios):</label> <textarea id="stationC" rows="1" class="w-full param-input text-sm" placeholder="Ej: 2, 20">12</textarea> <label for="backoffListC" class="block text-xs text-gray-600 mt-1 mb-1">Backoffs C:</label> <textarea id="backoffListC" rows="1" class="w-full backoff-list-input param-input text-sm" placeholder="Ej: 12, 22">5,10,5,12,10</textarea> </div>
                 <div class="input-group"> <label for="stationD" class="block text-sm text-orange-600 mb-1">D (Inicios):</label> <textarea id="stationD" rows="1" class="w-full param-input text-sm" placeholder="Ej: 10, 35">19</textarea> <label for="backoffListD" class="block text-xs text-gray-600 mt-1 mb-1">Backoffs D:</label> <textarea id="backoffListD" rows="1" class="w-full backoff-list-input param-input text-sm" placeholder="Ej: 5, 15">7,11,9,21,15</textarea> </div>
             </div>
        </div>
        <div class="mb-6 flex justify-center space-x-2">
             <button id="resetButton" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-3 rounded-lg shadow text-xs"> Iniciar/Reiniciar </button>
             <button id="prevStepButton" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-3 rounded-lg shadow text-xs" disabled> Paso Anterior </button>
            <button id="nextStepButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-lg shadow text-xs" disabled> Siguiente Paso </button>
        </div>
        <div id="messageArea" class="text-xs text-gray-700 bg-gray-100 p-3 rounded-lg border min-h-[80px]">
             <p>Configura parámetros y pulsa Iniciar.</p>
             <p id="currentTimeDisplay" class="font-semibold mt-1"></p>
             <div id="eventLog" class="mt-1 max-h-32 overflow-y-auto"></div>
        </div>
    </div>

    <div id="main-content" class="h-full">
        <div id="canvas-container">
             <canvas id="alohaCanvas" width="1200" height="350"></canvas>
        </div>
    </div>


    <script>
        // --- Constantes y Configuración ---
        const canvas = document.getElementById('alohaCanvas'); const ctx = canvas.getContext('2d');
        const resetButton = document.getElementById('resetButton'); const prevStepButton = document.getElementById('prevStepButton'); const nextStepButton = document.getElementById('nextStepButton');
        const messageArea = document.getElementById('messageArea'); const currentTimeDisplay = document.getElementById('currentTimeDisplay'); const eventLog = document.getElementById('eventLog'); const paramInputs = document.querySelectorAll('.param-input');
        const TOP_LINE_Y = 80; const BOTTOM_LINE_Y = 270; const SLOT_HEIGHT = BOTTOM_LINE_Y - TOP_LINE_Y; const TICK_HEIGHT = 10; const FRAME_HEIGHT = 18; const LINE_PADDING = 50;
        const STATION_CLASSES = { 'A': 'station-a', 'B': 'station-b', 'C': 'station-c', 'D': 'station-d' }; const STATUS_CLASSES = { 'COLLISION_FLAG': 'collision-flag', 'COLLIDED_STATUS': 'collided-status', 'SUCCESSFUL': 'successful', 'DROPPED': 'dropped' };

        // --- Estado Global ---
        let simulationInitialized = false; let allFrames = []; let eventQueue = []; let currentTime = 0; let originalFrameState = {}; let backoffLists = {}; let frameCounter = 0; let simulationParams = {}; let stationColorValues = {}; let simulationHistory = []; let currentStepIndex = -1;

        // --- Clases y Funciones ---
        class Frame { /* ... (sin cambios) ... */ constructor(id, station, startTime, transmissionSlots, propagationSlots, attempt = 1, originalFrameId = null) { this.id = id; this.originalFrameId = originalFrameId || id; this.station = station; this.startTime = startTime; this.transmissionSlots = transmissionSlots; this.propagationSlots = propagationSlots; this.endTime = startTime + transmissionSlots; this.attempt = attempt; this.status = 'idle'; this.physicalCollisionDetected = false; this.visible = false; this.topLineOccupation = null; this.bottomLineOccupation = null; this.calculateOccupation(); } calculateOccupation() { if (this.station === 'A' || this.station === 'B') { this.topLineOccupation = { start: this.startTime, end: this.endTime }; this.bottomLineOccupation = { start: this.startTime + this.propagationSlots, end: this.endTime + this.propagationSlots }; } else { this.bottomLineOccupation = { start: this.startTime, end: this.endTime }; this.topLineOccupation = { start: this.startTime + this.propagationSlots, end: this.endTime + this.propagationSlots }; } } draw(ctx, slotWidth, currentSimTime) { if (!this.visible || this.startTime > currentSimTime) return; const startX = LINE_PADDING + this.startTime * slotWidth; const currentEndTime = Math.min(this.endTime, currentSimTime); const endX = LINE_PADDING + currentEndTime * slotWidth; const arrivalStartTime = this.startTime + this.propagationSlots; const currentArrivalEndTime = Math.min(this.endTime + this.propagationSlots, currentSimTime); const propStartX = LINE_PADDING + arrivalStartTime * slotWidth; const arrivalEndX = LINE_PADDING + currentArrivalEndTime * slotWidth; let colorClassKey = this.station; if (this.status === 'successful') { colorClassKey = 'SUCCESSFUL'; } else if (this.status === 'dropped') { colorClassKey = 'DROPPED'; } else if (this.status === 'collided') { colorClassKey = 'COLLIDED_STATUS'; } else if (this.physicalCollisionDetected) { colorClassKey = 'COLLISION_FLAG'; } const colorClass = STATION_CLASSES[colorClassKey] || STATUS_CLASSES[colorClassKey] || STATION_CLASSES[this.station]; let finalBgColor = stationColorValues[colorClassKey]?.bg || 'rgba(128, 128, 128, 0.7)'; let finalBorderColor = stationColorValues[colorClassKey]?.border || 'black'; ctx.fillStyle = finalBgColor; ctx.strokeStyle = finalBorderColor; ctx.lineWidth = 1; ctx.beginPath(); if (this.station === 'A' || this.station === 'B') { if (currentEndTime > this.startTime) { ctx.rect(startX, TOP_LINE_Y - FRAME_HEIGHT / 2, endX - startX, FRAME_HEIGHT); ctx.fill(); ctx.stroke(); } if (currentArrivalEndTime > arrivalStartTime && currentSimTime >= arrivalStartTime) { ctx.beginPath(); ctx.rect(propStartX, BOTTOM_LINE_Y - FRAME_HEIGHT / 2, arrivalEndX - propStartX, FRAME_HEIGHT); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(startX, TOP_LINE_Y); ctx.lineTo(propStartX, BOTTOM_LINE_Y); ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)'; ctx.stroke(); } } else { if (currentEndTime > this.startTime) { ctx.rect(startX, BOTTOM_LINE_Y - FRAME_HEIGHT / 2, endX - startX, FRAME_HEIGHT); ctx.fill(); ctx.stroke(); } if (currentArrivalEndTime > arrivalStartTime && currentSimTime >= arrivalStartTime) { ctx.beginPath(); ctx.rect(propStartX, TOP_LINE_Y - FRAME_HEIGHT / 2, arrivalEndX - propStartX, FRAME_HEIGHT); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(startX, BOTTOM_LINE_Y); ctx.lineTo(propStartX, TOP_LINE_Y); ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)'; ctx.stroke(); } } if (currentSimTime >= this.startTime) { ctx.fillStyle = 'black'; ctx.font = '9px Arial'; ctx.textAlign = 'center'; const labelX = startX + Math.max(0, (endX - startX)) / 2; const labelY = (this.station === 'A' || this.station === 'B') ? TOP_LINE_Y - FRAME_HEIGHT - 8 : BOTTOM_LINE_Y + FRAME_HEIGHT + 8; ctx.fillText(`${this.station}${this.originalFrameId}-${this.attempt}`, labelX, labelY); } } }

        // Funciones auxiliares (sin cambios)
        function parseCommaSeparatedNumbers(inputStr) { if (!inputStr) return []; return inputStr.split(',').map(t => parseInt(t.trim(), 10)).filter(t => !isNaN(t) && t >= 0); }
        function drawAxes(maxSlotsToDraw, slotWidth, scheduledStarts, colors) { const totalWidth = LINE_PADDING * 2 + maxSlotsToDraw * slotWidth; if (canvas.width < totalWidth) { canvas.width = totalWidth; } ctx.clearRect(0, 0, canvas.width, canvas.height); const defaultFill = '#333'; const defaultFont = '10px Arial'; const boldFont = 'bold 10px Arial'; ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.beginPath(); ctx.moveTo(LINE_PADDING, TOP_LINE_Y); ctx.lineTo(totalWidth - LINE_PADDING, TOP_LINE_Y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(LINE_PADDING, BOTTOM_LINE_Y); ctx.lineTo(totalWidth - LINE_PADDING, BOTTOM_LINE_Y); ctx.stroke(); for (let i = 0; i <= maxSlotsToDraw; i++) { const x = LINE_PADDING + i * slotWidth; ctx.beginPath(); ctx.moveTo(x, TOP_LINE_Y - TICK_HEIGHT / 2); ctx.lineTo(x, TOP_LINE_Y + TICK_HEIGHT / 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, BOTTOM_LINE_Y - TICK_HEIGHT / 2); ctx.lineTo(x, BOTTOM_LINE_Y + TICK_HEIGHT / 2); ctx.stroke(); const stationsStartingNow = scheduledStarts.get(i); let topStation = null; let bottomStation = null; if (stationsStartingNow) { stationsStartingNow.forEach(stationId => { if (stationId === 'A' || stationId === 'B') topStation = stationId; if (stationId === 'C' || stationId === 'D') bottomStation = stationId; }); } ctx.font = defaultFont; ctx.fillStyle = defaultFill; if (topStation && colors[topStation]) { ctx.fillStyle = colors[topStation].text || defaultFill; ctx.font = boldFont; } ctx.fillText(i, x, TOP_LINE_Y - TICK_HEIGHT - 5); ctx.font = defaultFont; ctx.fillStyle = defaultFill; if (bottomStation && colors[bottomStation]) { ctx.fillStyle = colors[bottomStation].text || defaultFill; ctx.font = boldFont; } ctx.fillText(i, x, BOTTOM_LINE_Y + TICK_HEIGHT + 5); } ctx.font = defaultFont; ctx.fillStyle = defaultFill; }
        function addEvent(event) { eventQueue.push(event); eventQueue.sort((a, b) => a.time - b.time); }
        function logEventMessage(message, isHistoryLog = false) { if (!isHistoryLog) { eventLog.innerHTML = ''; } const logEntry = document.createElement('p'); logEntry.textContent = `[T=${currentTime.toFixed(1)}] ${message}`; eventLog.insertBefore(logEntry, eventLog.firstChild); }
        function intervalsOverlap(start1, end1, start2, end2) { return start1 < end2 && end1 > start2; }
        function precomputeColors() { /* ... (sin cambios) ... */ stationColorValues = {}; const colorKeys = { ...STATION_CLASSES, ...STATUS_CLASSES }; for (const key in colorKeys) { const className = colorKeys[key]; let tempDiv = document.createElement('div'); tempDiv.style.display = 'none'; tempDiv.className = className; document.body.appendChild(tempDiv); let computedStyle = window.getComputedStyle(tempDiv); stationColorValues[key] = { bg: computedStyle.backgroundColor || 'rgba(128, 128, 128, 0.5)', border: computedStyle.borderColor || 'black', text: computedStyle.color || '#333333' }; document.body.removeChild(tempDiv); } const statusColorKeys = Object.keys(STATUS_CLASSES); statusColorKeys.forEach(key => { if (!stationColorValues[key]) { const className = STATUS_CLASSES[key]; let tempDiv = document.createElement('div'); tempDiv.style.display = 'none'; tempDiv.className = className; document.body.appendChild(tempDiv); let computedStyle = window.getComputedStyle(tempDiv); stationColorValues[key] = { bg: computedStyle.backgroundColor || 'rgba(128, 128, 128, 0.5)', border: computedStyle.borderColor || 'black', text: computedStyle.color || '#333333' }; document.body.removeChild(tempDiv); } }); console.log("Precomputed colors:", stationColorValues); }
        // deepCopy (MODIFICADO para loguear mejor el error)
        function deepCopy(obj) {
            let jsonString = '';
            try {
                // Manejar Map específicamente (JSON.stringify no lo soporta bien)
                if (obj instanceof Map) {
                    return new Map(JSON.parse(JSON.stringify(Array.from(obj.entries()))));
                }
                 // Manejar Set específicamente
                 if (obj instanceof Set) {
                    return new Set(JSON.parse(JSON.stringify(Array.from(obj.values()))));
                 }
                // Caso general
                jsonString = JSON.stringify(obj);
                return JSON.parse(jsonString);
            } catch (e) {
                console.error("Deep copy failed:", e);
                // Intentar loguear el objeto directamente si falla stringify
                if (e instanceof TypeError && e.message.includes('circular structure')) {
                     console.error("Object contains circular references or unsupported types.");
                } else if (jsonString) {
                     console.error("Object that failed PARSE (approx):", jsonString.substring(0, 500));
                } else {
                     console.error("Object that failed STRINGIFY (structure might be complex/unsupported):", obj);
                }
                return null; // Indicar fallo
            }
        }


        // --- Lógica Principal ---

        // initializeSimulation (sin cambios)
        function initializeSimulation() { console.log("Initializing simulation..."); precomputeColors(); simulationParams = { Tt: parseInt(document.getElementById('transmissionSlots').value, 10), Tp: parseInt(document.getElementById('propagationSlots').value, 10), maxSlots: parseInt(document.getElementById('maxSlots').value, 10), maxRetransmissions: parseInt(document.getElementById('maxRetransmissions').value, 10) }; backoffLists = { 'A': parseCommaSeparatedNumbers(document.getElementById('backoffListA').value), 'B': parseCommaSeparatedNumbers(document.getElementById('backoffListB').value), 'C': parseCommaSeparatedNumbers(document.getElementById('backoffListC').value), 'D': parseCommaSeparatedNumbers(document.getElementById('backoffListD').value) }; let isValid = true; let errorMessages = []; if (isNaN(simulationParams.Tt) || simulationParams.Tt <= 0) { isValid = false; errorMessages.push("Tt debe ser > 0."); } if (isNaN(simulationParams.Tp) || simulationParams.Tp < 0) { isValid = false; errorMessages.push("Tp debe ser >= 0."); } if (isNaN(simulationParams.maxSlots) || simulationParams.maxSlots <= 0) { isValid = false; errorMessages.push("Slots a Visualizar debe ser > 0."); } if (isNaN(simulationParams.maxRetransmissions) || simulationParams.maxRetransmissions < 1) { isValid = false; errorMessages.push("Máx. Intentos debe ser >= 1."); } if (!isValid) { messageArea.firstChild.textContent = `Error en los parámetros: ${errorMessages.join(' ')}`; currentTimeDisplay.textContent = ""; eventLog.innerHTML = ""; return; } allFrames = []; eventQueue = []; currentTime = 0; originalFrameState = {}; frameCounter = 0; simulationHistory = []; currentStepIndex = -1; simulationInitialized = false; eventLog.innerHTML = ""; const initialScheduledStarts = new Map(); const stations = ['A', 'B', 'C', 'D']; stations.forEach(stationId => { const startTimes = parseCommaSeparatedNumbers(document.getElementById(`station${stationId}`).value); startTimes.forEach(startTime => { if (startTime < simulationParams.maxSlots) { const frameId = `F${++frameCounter}`; const originalId = frameId; const newFrame = new Frame(frameId, stationId, startTime, simulationParams.Tt, simulationParams.Tp, 1, originalId); allFrames.push(newFrame); originalFrameState[originalId] = { attempts: 1, backoffIndex: 0, successful: false, dropped: false }; addEvent({ time: startTime, type: 'start_tx', frameId: frameId }); if (!initialScheduledStarts.has(startTime)) { initialScheduledStarts.set(startTime, new Set()); } initialScheduledStarts.get(startTime).add(stationId); } }); }); if (allFrames.length === 0) { messageArea.firstChild.textContent = "No hay tramas iniciales programadas."; currentTimeDisplay.textContent = ""; nextStepButton.disabled = true; paramInputs.forEach(input => input.disabled = false); resetButton.disabled = false; return; } simulationInitialized = true; messageArea.firstChild.textContent = "Simulación iniciada. Pulsa 'Siguiente Paso'."; logEventMessage("Simulación inicializada."); saveStateToHistory(); currentStepIndex = 0; updateButtons(); updateVisualization(); console.log("Initial State Saved. History length:", simulationHistory.length); }

        // executeNextStep (MODIFICADO para usar el retorno de saveStateToHistory)
        function executeNextStep() {
            console.log("Next Step Clicked. Current Index:", currentStepIndex, "History Length:", simulationHistory.length);
            if (!simulationInitialized) { console.log("Sim not initialized"); return; }

            // Si estamos en medio del historial, simplemente avanzamos
            if (currentStepIndex < simulationHistory.length - 1) {
                const targetIndex = currentStepIndex + 1;
                if (loadStateFromHistory(targetIndex)) {
                    currentStepIndex = targetIndex;
                    console.log(`Moved forward in history to step ${currentStepIndex}`);
                    updateButtons();
                    updateVisualization();
                } else {
                    console.error("Failed to load next state from history.");
                    // Podríamos intentar invalidar el resto del historial o detener
                    simulationInitialized = false; // Detener por seguridad
                    updateButtons();
                }
                return;
            }

            // Si estamos al final del historial, calculamos el siguiente paso
            if (eventQueue.length === 0 || eventQueue[0].time >= simulationParams.maxSlots) {
                logEventMessage("Fin de la simulación (no hay más eventos o se alcanzó el tiempo límite).");
                updateButtons(); // Deshabilitar 'Siguiente'
                return;
            }

            // --- Calcular el siguiente estado ---
            const nextEventTime = eventQueue[0].time;
            currentTime = nextEventTime;

            const eventsToProcess = [];
            while (eventQueue.length > 0 && eventQueue[0].time === currentTime) { eventsToProcess.push(eventQueue.shift()); }
            console.log(`Calculating Step ${currentStepIndex + 1} at T=${currentTime}:`, eventsToProcess);
            eventLog.innerHTML = ''; // Limpiar log para los mensajes de este nuevo paso

            // Procesar eventos y detectar colisiones físicas (Paso 2 y 3)
            let collisionCheckNeeded = false;
            eventsToProcess.forEach(event => { /* ... (lógica igual que antes) ... */ });
            // ... (código de procesamiento de eventos) ...
            eventsToProcess.forEach(event => { const frame = allFrames.find(f => f.id === event.frameId); if (!frame || frame.status === 'dropped' || frame.status === 'successful') return; logEventMessage(`Evento: ${event.type} para Trama ${frame.station}${frame.originalFrameId}-${frame.attempt}`); switch (event.type) { case 'start_tx': frame.status = 'transmitting'; frame.visible = true; addEvent({ time: frame.endTime, type: 'end_tx', frameId: frame.id }); const arrivalTime = frame.startTime + simulationParams.Tp; addEvent({ time: arrivalTime, type: 'start_rx', frameId: frame.id }); addEvent({ time: arrivalTime + simulationParams.Tt, type: 'end_rx', frameId: frame.id }); collisionCheckNeeded = true; break; case 'end_tx': frame.status = 'finished_tx'; break; case 'start_rx': frame.status = 'receiving'; collisionCheckNeeded = true; break; case 'end_rx': frame.status = 'potentially_finished'; collisionCheckNeeded = true; break; } });

            if (collisionCheckNeeded) { /* ... (detección colisión física igual que antes) ... */ }
            // ... (código detección colisión física) ...
             if (collisionCheckNeeded) { const potentiallyActiveFrames = allFrames.filter(f => f.visible && f.status !== 'successful' && f.status !== 'dropped'); for (let i = 0; i < potentiallyActiveFrames.length; i++) { for (let j = i + 1; j < potentiallyActiveFrames.length; j++) { const f1 = potentiallyActiveFrames[i]; const f2 = potentiallyActiveFrames[j]; if (!f1.physicalCollisionDetected || !f2.physicalCollisionDetected) { const topOverlap = f1.topLineOccupation && f2.topLineOccupation && intervalsOverlap(f1.topLineOccupation.start, f1.topLineOccupation.end, f2.topLineOccupation.start, f2.topLineOccupation.end); const bottomOverlap = f1.bottomLineOccupation && f2.bottomLineOccupation && intervalsOverlap(f1.bottomLineOccupation.start, f1.bottomLineOccupation.end, f2.bottomLineOccupation.start, f2.bottomLineOccupation.end); if (topOverlap || bottomOverlap) { if (!f1.physicalCollisionDetected) { f1.physicalCollisionDetected = true; console.log(`Physical overlap flag set for ${f1.id}`); } if (!f2.physicalCollisionDetected) { f2.physicalCollisionDetected = true; console.log(`Physical overlap flag set for ${f2.id}`); } } } } } }


            // Procesar tramas terminadas y aplicar reglas (Paso 4)
            allFrames.forEach(frame => { /* ... (lógica híbrida igual que antes) ... */ });
             // ... (código procesamiento potentially_finished con regla híbrida) ...
             allFrames.forEach(frame => { if (frame.status === 'potentially_finished') { const originalState = originalFrameState[frame.originalFrameId]; if (!originalState) { console.error(`Missing original state for frame ${frame.originalFrameId}`); frame.status = 'dropped'; return; } if (originalState.successful || originalState.dropped) { frame.status = originalState.successful ? 'successful' : 'dropped'; return; } let isOfficiallyCollided = false; if (frame.physicalCollisionDetected) { for (const otherFrame of allFrames) { if (otherFrame.id === frame.id) continue; const physicalTopOverlap = frame.topLineOccupation && otherFrame.topLineOccupation && intervalsOverlap(frame.topLineOccupation.start, frame.topLineOccupation.end, otherFrame.topLineOccupation.start, otherFrame.topLineOccupation.end); const physicalBottomOverlap = frame.bottomLineOccupation && otherFrame.bottomLineOccupation && intervalsOverlap(frame.bottomLineOccupation.start, frame.bottomLineOccupation.end, otherFrame.bottomLineOccupation.start, otherFrame.bottomLineOccupation.end); if (!physicalTopOverlap && !physicalBottomOverlap) continue; const isFrameTop = (frame.station === 'A' || frame.station === 'B'); const isOtherFrameTop = (otherFrame.station === 'A' || otherFrame.station === 'B'); if (isFrameTop === isOtherFrameTop) { isOfficiallyCollided = true; logEventMessage(`Trama ${frame.station}${frame.originalFrameId}-${frame.attempt} DETECTA COLISIÓN (Mismo Lado): Solapamiento físico con ${otherFrame.station}${otherFrame.originalFrameId}-${otherFrame.attempt}.`); break; } else { const arrivalStart = otherFrame.startTime + simulationParams.Tp; const arrivalEnd = otherFrame.endTime + simulationParams.Tp; if (intervalsOverlap(frame.startTime, frame.endTime, arrivalStart, arrivalEnd)) { isOfficiallyCollided = true; logEventMessage(`Trama ${frame.station}${frame.originalFrameId}-${frame.attempt} DETECTA COLISIÓN (Regla Usuario): Trama ${otherFrame.station}${otherFrame.originalFrameId}-${otherFrame.attempt} llegó durante su transmisión.`); break; } } } } if (isOfficiallyCollided) { frame.status = 'collided'; if (originalState.attempts < simulationParams.maxRetransmissions) { const backoffList = backoffLists[frame.station]; const backoffIndex = originalState.backoffIndex; if (backoffIndex < backoffList.length) { const backoffSlots = backoffList[backoffIndex]; const newStartTime = frame.endTime + backoffSlots; if (newStartTime < simulationParams.maxSlots) { const newFrameId = `F${++frameCounter}`; const newAttempt = originalState.attempts + 1; const retransmissionFrame = new Frame(newFrameId, frame.station, newStartTime, simulationParams.Tt, simulationParams.Tp, newAttempt, frame.originalFrameId); allFrames.push(retransmissionFrame); addEvent({ time: newStartTime, type: 'start_tx', frameId: newFrameId }); originalState.attempts = newAttempt; originalState.backoffIndex = backoffIndex + 1; logEventMessage(`Programada retransmisión ${newAttempt} para Trama Original ${frame.originalFrameId} en T=${newStartTime.toFixed(1)} (Backoff: ${backoffSlots} slots).`); } else { logEventMessage(`Retransmisión para ${frame.originalFrameId} descartada (inicio >= maxSlots).`); originalState.dropped = true; frame.status = 'dropped'; } } else { logEventMessage(`Lista de backoffs agotada para ${frame.originalFrameId}. Trama descartada.`); originalState.dropped = true; frame.status = 'dropped'; } } else { logEventMessage(`Máximo de intentos (${simulationParams.maxRetransmissions}) alcanzado para ${frame.originalFrameId}. Trama descartada.`); originalState.dropped = true; frame.status = 'dropped'; } } else { frame.status = 'successful'; originalState.successful = true; if (frame.physicalCollisionDetected) { logEventMessage(`Trama ${frame.station}${frame.originalFrameId}-${frame.attempt} ÉXITO (Regla Usuario: no detectó colisión a pesar de solapamiento físico).`); } else { logEventMessage(`Trama ${frame.station}${frame.originalFrameId}-${frame.attempt} LLEGÓ CON ÉXITO.`); } } } });


            // Guardar este nuevo estado calculado en el historial
            if (saveStateToHistory()) { // Comprobar si el guardado fue exitoso
                 currentStepIndex++; // Avanzar el índice actual SOLO si se guardó bien
            } else {
                 console.error("Failed to save current state to history. Stopping simulation.");
                 simulationInitialized = false; // Detener por seguridad
                 updateButtons();
                 return; // No continuar si no se pudo guardar
            }


            // Actualizar UI
            updateButtons();
            updateVisualization(); // Dibuja el nuevo estado

            // Comprobar fin de simulación después de guardar el estado
            if (eventQueue.length === 0 || eventQueue[0].time >= simulationParams.maxSlots) {
                logEventMessage("Fin de la simulación (no hay más eventos o se alcanzó el tiempo límite).");
                updateButtons(); // Deshabilitar 'Siguiente'
            }
        }

        // executePreviousStep (MODIFICADO para usar retorno de loadState)
        function executePreviousStep() {
            console.log("Prev Step Clicked. Current Index:", currentStepIndex);
            if (!simulationInitialized || currentStepIndex <= 0) {
                console.log("Cannot go back further.");
                return; // No se puede retroceder más
            }

            const targetIndex = currentStepIndex - 1;
            if (loadStateFromHistory(targetIndex)) { // Si la carga fue exitosa
                currentStepIndex = targetIndex;
                console.log(`Moved back in history to step ${currentStepIndex}`);
                updateButtons();
                updateVisualization();
            } else {
                console.error("Failed to load previous state.");
                // Podríamos intentar invalidar el historial o detener
                simulationInitialized = false; // Detener por seguridad
                updateButtons();
            }
        }

        // saveStateToHistory (MODIFICADO para retornar booleano)
        function saveStateToHistory() {
            const framesCopy = deepCopy(allFrames);
            const queueCopy = deepCopy(eventQueue);
            const originalStateCopy = deepCopy(originalFrameState);

            if (framesCopy === null || queueCopy === null || originalStateCopy === null) {
                console.error("Failed to deep copy state for history save.");
                return false; // Indicar fallo
            }

            const stateSnapshot = {
                currentTime: currentTime,
                allFrames: framesCopy,
                eventQueue: queueCopy,
                originalFrameState: originalStateCopy,
                logHTML: eventLog.innerHTML
            };
            simulationHistory.push(stateSnapshot);
            console.log(`State saved at step ${simulationHistory.length - 1}, T=${currentTime}`);
            return true; // Indicar éxito
        }

        // loadStateFromHistory (MODIFICADO para retornar booleano y verificar copia)
        function loadStateFromHistory(index) {
            if (index < 0 || index >= simulationHistory.length) {
                console.error(`Invalid history index: ${index}`);
                return false; // Indicar fallo
            }
            const snapshot = simulationHistory[index];

            // Restaurar estado global desde las copias guardadas, verificando copias
            const copiedFrames = deepCopy(snapshot.allFrames);
            const copiedQueue = deepCopy(snapshot.eventQueue);
            const copiedOriginalState = deepCopy(snapshot.originalFrameState);

            if (copiedFrames === null || copiedQueue === null || copiedOriginalState === null) {
                console.error(`Failed to deep copy state from history index ${index}. Aborting load.`);
                return false; // Indicar fallo
            }

            currentTime = snapshot.currentTime;
            allFrames = copiedFrames;
            eventQueue = copiedQueue;
            originalFrameState = copiedOriginalState;
            eventLog.innerHTML = snapshot.logHTML; // Restaurar log
            currentTimeDisplay.textContent = `Tiempo Actual: ${currentTime.toFixed(1)}`;

            console.log(`State loaded from step ${index}, T=${currentTime}`);
            return true; // Indicar éxito
        }

        // updateButtons (sin cambios)
        function updateButtons() { if (!simulationInitialized) { prevStepButton.disabled = true; nextStepButton.disabled = true; resetButton.disabled = false; paramInputs.forEach(input => input.disabled = false); } else { resetButton.disabled = false; paramInputs.forEach(input => input.disabled = true); prevStepButton.disabled = (currentStepIndex <= 0); const isAtEndOfHistory = currentStepIndex >= simulationHistory.length - 1; const simulationHasEnded = eventQueue.length === 0 || (eventQueue.length > 0 && eventQueue[0].time >= simulationParams.maxSlots); nextStepButton.disabled = (isAtEndOfHistory && simulationHasEnded); } }

        // updateVisualization (sin cambios)
        function updateVisualization() { const currentScheduledStarts = new Map(); allFrames.forEach(frame => { if (frame.status === 'idle' || frame.status === 'transmitting' || frame.status === 'finished_tx' || frame.status === 'receiving') { if (!currentScheduledStarts.has(frame.startTime)) { currentScheduledStarts.set(frame.startTime, new Set()); } currentScheduledStarts.get(frame.startTime).add(frame.station); } }); const slotWidth = Math.max(15, (canvas.width - 2 * LINE_PADDING) / simulationParams.maxSlots); if (slotWidth * simulationParams.maxSlots + 2 * LINE_PADDING > canvas.width) { canvas.width = slotWidth * simulationParams.maxSlots + 2 * LINE_PADDING; } drawAxes(simulationParams.maxSlots, slotWidth, currentScheduledStarts, stationColorValues); allFrames.forEach(frame => frame.draw(ctx, slotWidth, currentTime)); }


        // --- Event Listeners ---
        resetButton.addEventListener('click', () => {
            console.log("Reset button clicked");
            initializeSimulation();
        });
        prevStepButton.addEventListener('click', () => {
            console.log("Prev step button clicked");
            executePreviousStep();
        });
        nextStepButton.addEventListener('click', () => {
             console.log("Next step button clicked");
            executeNextStep();
        });

        // --- Inicialización al Cargar ---
        document.addEventListener('DOMContentLoaded', () => {
            precomputeColors();
            drawAxes(parseInt(document.getElementById('maxSlots').value, 10) || 60, 15, new Map(), stationColorValues);
            updateButtons(); // Asegurar estado inicial correcto de botones
        });

    </script>
</body>
